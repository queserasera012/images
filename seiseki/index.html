<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="成績">
<meta name="theme-color" content="#1F2A44">
<title>毎日の成績</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf5fb; --card:#ffffff; --ink:#1F2A44; --ink2:#55607a; --ink3:#8a93a8; --line:#e2e6ee;
  --navy:#1F2A44; --sky:#4FB8E8; --iap:#2a78d6; --ad:#eb6834; --dl:#1F2A44; --up:#0a7d4f; --down:#b3402c; --warn:#fff3d6; --pdl:#dff2fc; --pdlt:#14608c; --pyen:#ffeec9; --pyent:#8a5a00; --shadow:#d3e6f1;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#11151f; --card:#1a1f2c; --ink:#f0efec; --ink2:#c0c5d2; --ink3:#8a93a8; --line:#2c3344;
    --iap:#3987e5; --ad:#d95926; --dl:#c9d3ea; --up:#4fd19a; --down:#f08a76; --warn:#3a3116; --pdl:#17364a; --pdlt:#9bd8f7; --pyen:#40331a; --pyent:#ffd98a; --shadow:#0b0e15; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic",system-ui,sans-serif;font-weight:500}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
header .blk{display:flex;gap:3px}
header .blk i{width:12px;height:12px;border-radius:3px;display:block}
header h1{font-size:17px;font-weight:900;margin:0;flex:1}
header small{font-size:11px;opacity:.75;display:block;font-weight:500}
header button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px}
main{max-width:560px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 3px 0 var(--shadow)}
.card h2,h2.sec{font-size:15px;color:var(--ink);margin:0 0 10px;font-weight:900}
h2.sec{margin:18px 4px 10px;display:flex;align-items:baseline;gap:8px}
h2.sec small{font-size:11px;color:var(--ink3);font-weight:500}
.herocard{background:linear-gradient(140deg,#4FB8E8,#2f86d2);color:#fff;box-shadow:0 3px 0 #2a6fae}
.herocard h2{color:#fff;opacity:.92;font-size:13px;font-weight:700}
.herocard .stat span,.herocard .sub{color:rgba(255,255,255,.92)}
.herocard .stat b{font-size:40px}
.herocard em{background:#fff;border-radius:999px;padding:1px 8px;margin-left:2px}
.herocard .calm{background:rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;font-size:13px;margin-top:10px}
.apps{display:grid;gap:10px;margin-bottom:14px}
.appcard{background:var(--card);border-radius:22px;padding:12px 14px;display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;box-shadow:0 3px 0 var(--shadow);border:0;text-align:left;font:inherit;color:inherit;width:100%}
.appcard.quiet{opacity:.72}
.appcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.ico{width:60px;height:60px;border-radius:15px;object-fit:cover;display:block;background:var(--bg)}
.ico.s{width:22px;height:22px;border-radius:6px;display:inline-block;vertical-align:-5px;margin-right:6px}
.ico.m{width:44px;height:44px;border-radius:11px}
.ico.f{display:grid;place-items:center;color:#fff;font-weight:900;font-size:24px}
.ico.s.f{display:inline-grid;font-size:11px}
.appcard .nm{font-weight:900;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appcard .nm small{font-size:10px;color:var(--ink3);font-weight:500;margin-left:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{border-radius:999px;padding:3px 10px;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.dl{background:var(--pdl);color:var(--pdlt)} .pill.yen{background:var(--pyen);color:var(--pyent)}
.pill.zero{background:var(--bg);color:var(--ink3);font-weight:700}
.pill.new{background:#FF6B6B;color:#fff}
.wk{text-align:right;font-size:10px;color:var(--ink3);line-height:1.5;font-variant-numeric:tabular-nums}
.wk svg{width:64px;height:30px;margin-left:auto}
.wk b{color:var(--ink2);font-weight:700}
.apphead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.apphead div{font-weight:900;font-size:16px;line-height:1.3}
.apphead small{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:30px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
.stat em{font-style:normal;font-size:12px;font-weight:700}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink3)}
.sub{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.6}
.alert{background:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:8px;line-height:1.5}
.alert b{font-weight:900}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}
.row .n{font-variant-numeric:tabular-nums;text-align:right;min-width:52px;font-weight:700}
.row .n small{display:block;font-size:10px;color:var(--ink3);font-weight:500}
.row .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name small{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;box-shadow:0 2px 0 var(--shadow);margin-bottom:2px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme: dark){.chip.on{background:var(--sky);border-color:var(--sky);color:#11151f}}
.legend{display:flex;gap:12px;font-size:11px;color:var(--ink2);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.read{font-size:12px;color:var(--ink2);min-height:18px;margin-bottom:2px;font-variant-numeric:tabular-nums}
svg{display:block;width:100%;height:auto;touch-action:pan-y}
svg text{font-family:inherit;fill:var(--ink3);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--ink3);font-weight:500;text-align:right;padding:4px 0 6px}
th:first-child,td:first-child{text-align:left}
td{padding:8px 0;border-top:1px solid var(--line);text-align:right}
td:first-child{font-weight:700;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.total td{font-weight:900;border-top:2px solid var(--ink)}
.bar{height:4px;border-radius:2px;background:var(--iap);margin-top:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;font:inherit;font-size:12px;font-weight:700;color:var(--ink3);padding:9px 0;border-radius:12px}
nav button.on{color:#fff;background:var(--navy)}
@media (prefers-color-scheme: dark){nav button.on{background:var(--sky);color:#11151f}}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:15px;padding:13px;margin-top:10px}
.btn.ghost{background:none;color:var(--ink2);border:1px solid var(--line)}
input,select{font:inherit;font-size:16px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-top:6px}
label{font-size:12px;color:var(--ink2);display:block;margin-top:10px}
.note{font-size:11px;color:var(--ink3);line-height:1.6;margin:4px 2px 14px}
.marks{font-size:12px;color:var(--ink2);line-height:1.8}
.marks button{border:0;background:none;color:var(--ink3);font:inherit;font-size:12px;padding:0 6px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px;color:var(--ink)}
.check input{width:auto;margin:0}
ol.steps{font-size:13px;line-height:1.8;padding-left:20px;color:var(--ink2)}
</style>
</head>
<body>
<header>
  <span class="blk"><i style="background:#FF6B6B"></i><i style="background:#FFD23F"></i><i style="background:#3DDC97"></i></span>
  <h1>毎日の成績<small id="upd">—</small></h1>
  <button id="reload">更新</button>
</header>
<main id="main"></main>
<nav id="nav" hidden>
  <button data-t="today" class="on">きょう</button>
  <button data-t="app">アプリ</button>
  <button data-t="country">国</button>
  <button data-t="month">月</button>
</nav>
<script>
'use strict';
const REPO = 'queserasera012/claude-company';
const DIR = '.company/secretary/daily/';
const K = { token: 'seiseki.token.v1', marks: 'seiseki.marks.v1', ui: 'seiseki.ui.v1', cache: 'seiseki.cache.v1' };
const $ = (s, el = document) => el.querySelector(s);
const main = $('#main');
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let D = null, MARKS = [], ui = Object.assign({ tab: 'today', app: 'all', range: 28, month: null, showYen: true }, ls.get(K.ui, {}));
const LOCAL = new URLSearchParams(location.search).has('local');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const yen1 = n => '¥' + (Math.abs(n) < 100 ? (Math.round(n * 10) / 10).toLocaleString('ja-JP') : Math.round(n).toLocaleString('ja-JP'));
const WD = '日月火水木金土';
const dObj = s => new Date(s + 'T00:00:00Z');
const md = s => { const d = dObj(s); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
const mdw = s => `${md(s)}（${WD[dObj(s).getUTCDay()]}）`;
const addDays = (s, n) => { const d = dObj(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
let regionName; try { regionName = new Intl.DisplayNames(['ja'], { type: 'region' }); } catch {}
const country = c => { try { return (regionName && regionName.of(c)) || c; } catch { return c; } };

// ── データを読む ─────────────────────────────
async function gh(file) {
  if (LOCAL) { const r = await fetch('./' + file + '?' + Date.now()); if (!r.ok) throw new Error(r.status); return r.json(); }
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${DIR}${file}?ref=main&t=${Date.now()}`, {
    headers: { Authorization: 'Bearer ' + ls.get(K.token, ''), Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' });
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function load() {
  if (!LOCAL && !ls.get(K.token, '')) return setup();
  $('#upd').textContent = '読みこみ中…';
  try {
    D = await gh('data.json');
    ls.set(K.cache, D);
  } catch (e) {
    if (e.status === 401 || e.status === 403 || e.status === 404) return setup(e.status === 404 ? 'データが見つかりません。鍵の「読める範囲」に claude-company が入っているか確かめてください。' : '鍵が通りませんでした（期限切れかもしれません）。');
    D = ls.get(K.cache, null);
    if (!D) { main.innerHTML = `<div class="card">読みこめませんでした（${esc(e.message)}）。電波のあるところで「更新」を押してください。</div>`; return; }
  }
  let repoMarks = [];
  try { repoMarks = await gh('marks.json'); } catch {}
  MARKS = repoMarks.map(m => ({ ...m, src: 'repo' })).concat(ls.get(K.marks, []).map(m => ({ ...m, src: 'me' })));
  const u = new Date(D.updated);
  $('#upd').textContent = `${u.getMonth() + 1}/${u.getDate()} ${String(u.getHours()).padStart(2, '0')}:${String(u.getMinutes()).padStart(2, '0')} に集計`;
  $('#nav').hidden = false;
  render();
}
function setup(msg) {
  $('#nav').hidden = true; $('#upd').textContent = 'はじめの設定';
  main.innerHTML = `<div class="card"><h2>読み取り用の鍵を1回だけ入れる</h2>
  ${msg ? `<div class="alert">${esc(msg)}</div>` : ''}
  <div class="sub">数字は このページには入っていません。あなたの端末が、非公開の claude-company から直接読みます。鍵は この端末の中にだけ残ります。</div>
  <ol class="steps"><li>GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token</li>
  <li>Repository access：Only select repositories → <b>claude-company</b></li>
  <li>Permissions → Repository → <b>Contents：Read-only</b>（ほかは触らない）</li>
  <li>できた <code>github_pat_…</code> を下に貼る</li></ol>
  <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off" autocapitalize="off">
  <button class="btn" id="save">保存して開く</button></div>`;
  $('#save').onclick = () => { const v = $('#tok').value.trim(); if (v) { ls.set(K.token, v); load(); } };
}

// ── 集計 ─────────────────────────────
const appIds = () => Object.keys(D.apps);
const cell = (day, id) => (D.days[day] && D.days[day][id]) || {};
const num = (day, ids, f) => ids.reduce((s, id) => s + f(cell(day, id)), 0);
const F = { dl: c => c.dl || 0, iap: c => c.yen || 0, n: c => c.iap || 0, ad: c => (c.ad && c.ad.yen) || 0, impr: c => (c.ad && c.ad.impr) || 0 };
const rev = c => F.iap(c) + F.ad(c);
const idsOf = sel => sel === 'all' ? appIds() : [sel];
const lastDay = () => Object.keys(D.days).sort().pop();
const salesDay = () => D.sales_through || lastDay();
function span(end, n) { const a = []; for (let i = n - 1; i >= 0; i--) a.push(addDays(end, -i)); return a; }
function sum(days, ids, f) { return days.reduce((s, d) => s + num(d, ids, f), 0); }
const ICOL = ['#FF6B6B', '#4FB8E8', '#3DDC97', '#FFB03F', '#8f7be8', '#e87ba4'];
function iconUrl(id) {
  const a = D.apps[id] || {}; if (a.icon) return a.icon;
  const twin = Object.values(D.apps).find(b => b.icon && b.name === a.name);   // Android は 同じ名前の iOS の絵
  return twin ? twin.icon : null;
}
function ico(id, cls = '') {
  const u = iconUrl(id), n = short(id), col = ICOL[appIds().indexOf(id) % ICOL.length];
  const fb = `<span class="ico f ${cls}" style="background:${col}">${esc([...n][0] || '?')}</span>`;
  return u ? `<img class="ico ${cls}" src="${esc(u)}" alt="" loading="lazy" onerror="this.outerHTML=this.dataset.fb" data-fb="${esc(fb)}">` : fb;
}
function spark(vals, color) {
  const max = Math.max(1, ...vals), w = 64 / vals.length;
  return `<svg viewBox="0 0 64 30" aria-hidden="true">${vals.map((v, i) => { const h = v ? Math.max(3, 26 * v / max) : 2; return `<rect x="${i * w + 1.5}" y="${30 - h}" width="${w - 3}" height="${h}" rx="2" fill="${v ? color : 'var(--line)'}"/>`; }).join('')}</svg>`;
}
const short = id => (D.apps[id] && (D.apps[id].short || D.apps[id].name)) || id;
function delta(now, before, fmt = v => v) {
  const d = now - before;
  if (!d) return `<em class="flat">±0</em>`;
  return `<em class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${fmt(Math.abs(d))}</em>`;
}

// ── グラフ（積み上げ棒・1本の軸）─────────────────────────────
function bars(days, series, opt = {}) {
  const W = 340, H = opt.h || 120, L = 4, R = 4, T = 14, B = 16;
  const tot = days.map((_, i) => series.reduce((s, x) => s + Math.max(0, x.v[i]), 0));
  const max = Math.max(opt.min || 1, ...tot);
  const bw = (W - L - R) / days.length, w = Math.max(2, Math.min(18, bw - 2));
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>`;
  g += `<text x="${L}" y="9">${esc(opt.fmt ? opt.fmt(max) : max)}</text>`;
  const marks = MARKS.filter(m => days.includes(m.d) && (!opt.app || !m.app || m.app === opt.app));
  for (const m of marks) {
    const x = L + bw * days.indexOf(m.d) + bw / 2;
    g += `<line x1="${x}" x2="${x}" y1="${T - 4}" y2="${H - B}" stroke="var(--ink3)" stroke-dasharray="2 3"/><circle cx="${x}" cy="${T - 6}" r="3" fill="var(--ink3)"/>`;
  }
  days.forEach((d, i) => {
    const x = L + bw * i + (bw - w) / 2; let base = 0;
    series.forEach((s, k) => {
      const v = Math.max(0, s.v[i]); if (!v) return;
      const y1 = y(base + v), y0 = y(base), h = Math.max(1.5, y0 - y1 - (k ? 1.5 : 0));
      g += `<rect x="${x}" y="${y1}" width="${w}" height="${h}" rx="${Math.min(3, w / 2, h / 2)}" fill="${s.color}"/>`;
      base += v;
    });
    g += `<rect data-i="${i}" x="${L + bw * i}" y="0" width="${bw}" height="${H}" fill="transparent"/>`;
  });
  const step = days.length > 60 ? 14 : 7;
  for (let i = days.length - 1; i >= 0; i -= step) g += `<text x="${L + bw * i + bw / 2}" y="${H - 4}" text-anchor="middle">${md(days[i])}</text>`;
  const id = 'c' + Math.random().toString(36).slice(2, 8);
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return;
    const read = el.previousElementSibling;
    const show = i => {
      const d = days[i];
      const ms = MARKS.filter(m => m.d === d).map(m => '｜' + m.t).join('');
      read.textContent = `${mdw(d)}　` + series.map(s => `${s.name} ${s.fmt ? s.fmt(s.v[i]) : s.v[i]}`).join('・') + ms;
    };
    const pick = e => { const t = document.elementFromPoint(e.clientX, e.clientY); if (t && t.dataset && t.dataset.i != null) show(+t.dataset.i); };
    el.addEventListener('pointerdown', pick); el.addEventListener('pointermove', pick);
  });
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>` : '';
  return `${legend}<div class="read">${opt.hint || '棒を押すと その日の数字'}</div><svg id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || '')}">${g}</svg>`;
}
function charts(days, ids, app) {
  const s = f => days.map(d => num(d, ids, f));
  return `<div class="card"><h2>収入（課金＋広告）</h2>${bars(days, [
    { name: '課金', color: 'var(--iap)', v: s(F.iap), fmt: yen1 }, { name: '広告', color: 'var(--ad)', v: s(F.ad), fmt: yen1 }], { fmt: yen, min: 10, app, label: '日ごとの収入' })}</div>
  <div class="card"><h2>ダウンロード</h2>${bars(days, [{ name: 'DL', color: 'var(--dl)', v: s(F.dl) }], { min: 4, h: 100, app, label: '日ごとのダウンロード' })}</div>`;
}
function rangeChips() {
  return `<div class="chips">${[7, 28, 90].map(n => `<button class="chip ${ui.range === n ? 'on' : ''}" data-range="${n}">${n}日</button>`).join('')}</div>`;
}
function appChips(all) {
  const ids = appIds().sort((a, b) => sum(span(lastDay(), 28), [b], c => rev(c) + F.dl(c)) - sum(span(lastDay(), 28), [a], c => rev(c) + F.dl(c)));
  return `<div class="chips">${all ? `<button class="chip ${ui.app === 'all' ? 'on' : ''}" data-app="all">ぜんぶ</button>` : ''}${ids.map(id => `<button class="chip ${ui.app === id ? 'on' : ''}" data-app="${id}">${ico(id, 's')}${esc(short(id))}</button>`).join('')}</div>`;
}
const footnote = () => `<p class="note">日付は 太平洋時間の1日（日本の 夕方5時〜翌日の夕方5時ごろ）。App Store の数字は 翌日の夜10時ごろに出ます（いま ${md(salesDay())} まで）。広告は その日の分も 速報で入ります。円以外の課金は その日の為替の目安です。${(D.notes || []).length ? '<br>⚠ ' + D.notes.map(esc).join('／') : ''}</p>`;

// ── きょう ─────────────────────────────
function unusual(day) {
  const out = [], prev = span(addDays(day, -1), 28);
  for (const id of appIds()) for (const [k, f, unit] of [['DL', F.dl, v => v + '件'], ['広告', F.ad, yen1], ['課金', F.iap, yen]]) {
    if (k === '広告' && !(D.days[day] && D.ads_through >= day)) continue;
    const xs = prev.map(d => f(cell(d, id))), m = xs.reduce((a, b) => a + b, 0) / xs.length;
    const sd = Math.sqrt(xs.reduce((a, b) => a + (b - m) ** 2, 0) / xs.length), v = f(cell(day, id));
    const floor = k === 'DL' ? 3 : k === '広告' ? 10 : 100;
    if (v >= floor && v > m + Math.max(2 * sd, m)) out.push(`<b>${esc(short(id))}</b> の${k}が ${unit(v)}（ふだんは 1日 ${unit(Math.round(m * 10) / 10)}）`);
    else if (k === 'DL' && m >= 2 && v === 0) out.push(`<b>${esc(short(id))}</b> のDLが 0件（ふだんは 1日 ${Math.round(m * 10) / 10}件）`);
  }
  return out;
}
function today() {
  const sd = salesDay(), ids = appIds(), wk = addDays(sd, -7), ad = D.ads_through || lastDay();
  const dl = num(sd, ids, F.dl), r = num(sd, ids, rev), iap = num(sd, ids, F.iap), adv = num(sd, ids, F.ad);
  const mo = sd.slice(0, 7), mdays = Object.keys(D.days).filter(d => d.startsWith(mo));
  const un = unusual(sd);
  const list = ids.map(id => ({ id, dl: F.dl(cell(sd, id)), r: rev(cell(sd, id)), w: sum(span(sd, 7), [id], F.dl), wr: sum(span(sd, 7), [id], rev) }))
    .filter(x => x.w || x.wr || (D.apps[x.id].store === 'ios')).sort((a, b) => (b.r + b.dl + b.wr / 7 + b.w / 7) - (a.r + a.dl + a.wr / 7 + a.w / 7));
  const cards = list.map(x => {
    const quiet = !x.w && !x.wr && !x.dl && !x.r, a = D.apps[x.id];
    const fresh = MARKS.some(m => m.app === x.id && /公開/.test(m.t) && !/\d\.\d/.test(m.t) && m.d >= addDays(sd, -7));
    return `<button class="appcard ${quiet ? 'quiet' : ''}" data-go="${x.id}">${ico(x.id)}
      <div style="min-width:0"><div class="nm">${esc(short(x.id))}<small>${esc(verOf(x.id))}</small></div>
      <div class="pills">${fresh ? '<span class="pill new">New</span>' : ''}<span class="pill ${x.dl ? 'dl' : 'zero'}">DL ${x.dl}</span><span class="pill ${x.r ? 'yen' : 'zero'}">${yen1(x.r)}</span></div></div>
      <div class="wk">${spark(span(sd, 7).map(d => F.dl(cell(d, x.id))), 'var(--sky)')}7日 <b>${x.w}件</b>・<b>${yen(x.wr)}</b></div></button>`;
  }).join('');
  return `<div class="card herocard"><h2>${mdw(sd)} の成績</h2><div class="hero">
    <div class="stat"><b>${dl}</b><span>ダウンロード<br>先週の同じ曜日 ${delta(dl, num(wk, ids, F.dl))}</span></div>
    <div class="stat"><b>${yen1(r)}</b><span>収入（課金＋広告）<br>先週の同じ曜日 ${delta(r, num(wk, ids, rev), yen1)}</span></div></div>
    <div class="sub">課金 ${yen(iap)}・広告 ${yen1(adv)}　｜　${+mo.slice(5)}月の ここまで：DL ${sum(mdays, ids, F.dl)}件・${yen(sum(mdays, ids, rev))}</div>
    ${ad > sd ? `<div class="sub" style="margin-top:2px">広告の速報：${md(ad)} は いまのところ ${yen1(num(ad, ids, F.ad))}（表示 ${num(ad, ids, F.impr)}回）</div>` : ''}
    ${un.length ? '' : '<div class="calm">いつもと違うところは ありません。ふだんどおりの1日でした。</div>'}</div>
  ${un.length ? `<div class="card"><h2>いつもと違うところ</h2>${un.map(t => `<div class="alert">${t}</div>`).join('')}</div>` : ''}
  <h2 class="sec">アプリごと<small>${md(sd)} の数字と この7日の DL</small></h2><div class="apps">${cards}</div>
  ${charts(span(ad, 28), ids)}${marksCard()}${footnote()}`;
}
function verOf(id) { const a = D.apps[id]; if (a.store && a.store !== 'ios') return 'Android'; return [a.live && 'v' + a.live, a.next].filter(Boolean).join('・') || ''; }

// ── アプリ ─────────────────────────────
function appTab() {
  if (ui.app === 'all' || !D.apps[ui.app]) ui.app = appIds().sort((a, b) => sum(span(lastDay(), 28), [b], c => rev(c) + F.dl(c)) - sum(span(lastDay(), 28), [a], c => rev(c) + F.dl(c)))[0];
  const id = ui.app, a = D.apps[id], end = D.ads_through || lastDay(), days = span(end, ui.range), prev = span(addDays(end, -ui.range), ui.range);
  const t = f => sum(days, [id], f), p = f => sum(prev, [id], f);
  const rt = a.rating || {};
  return `${appChips(false)}${rangeChips()}
  <div class="card"><div class="apphead">${ico(id)}<div>${esc(short(id))}<small>${esc(a.name)}　${esc(verOf(id))}</small></div></div><div class="hero">
    <div class="stat"><b>${t(F.dl)}</b><span>DL　前の${ui.range}日から ${delta(t(F.dl), p(F.dl))}</span></div>
    <div class="stat"><b>${yen(t(rev))}</b><span>収入　${delta(t(rev), p(rev), yen)}</span></div></div>
    <div class="sub">課金 ${t(F.n)}件 ${yen(t(F.iap))}・広告 ${yen(t(F.ad))}（表示 ${t(F.impr).toLocaleString()}回）<br>
    評価：${['jp', 'us'].map(c => rt[c] && rt[c].n ? `${c === 'jp' ? '日本' : '米国'} ★${rt[c].avg}（${rt[c].n}件）` : `${c === 'jp' ? '日本' : '米国'} まだ`).join('・')}</div></div>
  ${charts(days, [id], id)}${countryTable(days, [id])}${footnote()}`;
}

// ── 国 ─────────────────────────────
function countryTable(days, ids) {
  const m = {};
  for (const d of days) for (const id of ids) {
    const c = cell(d, id);
    for (const [cc, v] of Object.entries(c.c || {})) { const s = m[cc] = m[cc] || [0, 0, 0]; s[0] += v[0]; s[1] += v[2]; }
    for (const [cc, v] of Object.entries((c.ad && c.ad.c) || {})) { const s = m[cc] = m[cc] || [0, 0, 0]; s[2] += v[0]; }
  }
  const rows = Object.entries(m).map(([cc, v]) => ({ cc, dl: v[0], iap: v[1], ad: v[2] })).sort((a, b) => (b.iap + b.ad) - (a.iap + a.ad) || b.dl - a.dl);
  if (!rows.length) return `<div class="card"><h2>国ごと</h2><div class="sub">この期間は まだ数字がありません。</div></div>`;
  const maxDl = Math.max(1, ...rows.map(r => r.dl));
  return `<div class="card"><h2>国ごと（${md(days[0])}〜${md(days[days.length - 1])} の合計）</h2><table><tr><th>国</th><th>DL</th><th>課金</th><th>広告</th></tr>
  ${rows.slice(0, 25).map(r => `<tr><td>${esc(country(r.cc))}<div class="bar" style="width:${Math.round(r.dl / maxDl * 100)}%;background:var(--dl);opacity:.55"></div></td><td>${r.dl}</td><td>${r.iap ? yen(r.iap) : '—'}</td><td>${r.ad ? yen1(r.ad) : '—'}</td></tr>`).join('')}</table>
  ${rows.length > 25 ? `<div class="sub">ほか ${rows.length - 25}か国</div>` : ''}</div>`;
}
function countryTab() {
  const end = D.ads_through || lastDay();
  return `${appChips(true)}${rangeChips()}${countryTable(span(end, ui.range), idsOf(ui.app))}
  <p class="note">日ごとには割っていません。小さいアプリを 国×日に割ると ほとんどが 0 になるためです。</p>`;
}

// ── 月 ─────────────────────────────
function monthRows(mo) {
  const days = Object.keys(D.days).filter(d => d.startsWith(mo));
  const rows = appIds().map(id => ({ id, name: short(id), dl: sum(days, [id], F.dl), iap: sum(days, [id], F.iap), ad: sum(days, [id], F.ad) }))
    .filter(r => r.dl || r.iap || r.ad).sort((a, b) => (b.iap + b.ad) - (a.iap + a.ad) || b.dl - a.dl);
  const tot = rows.reduce((s, r) => ({ dl: s.dl + r.dl, iap: s.iap + r.iap, ad: s.ad + r.ad }), { dl: 0, iap: 0, ad: 0 });
  return { rows, tot, days };
}
function monthTab() {
  const months = [...new Set(Object.keys(D.days).map(d => d.slice(0, 7)))].sort().reverse();
  if (!ui.month || !months.includes(ui.month)) ui.month = months[0];
  const { rows, tot, days } = monthRows(ui.month);
  const first = Object.keys(D.days).sort()[0];
  return `<div class="chips">${months.map(m => `<button class="chip ${ui.month === m ? 'on' : ''}" data-month="${m}">${+m.slice(5)}月</button>`).join('')}</div>
  <div class="card"><h2>${ui.month.slice(0, 4)}年${+ui.month.slice(5)}月${days.length && days[0] === first && first.slice(8) !== '01' ? `（${md(first)} から）` : ''}</h2>
  <table><tr><th>アプリ</th><th>DL</th><th>課金</th><th>広告</th><th>合計</th></tr>
  ${rows.map(r => `<tr><td>${ico(r.id, 's')}${esc(r.name)}</td><td>${r.dl}</td><td>${yen(r.iap)}</td><td>${yen(r.ad)}</td><td>${yen(r.iap + r.ad)}</td></tr>`).join('')}
  <tr class="total"><td>合計</td><td>${tot.dl}</td><td>${yen(tot.iap)}</td><td>${yen(tot.ad)}</td><td>${yen(tot.iap + tot.ad)}</td></tr></table>
  <label class="check"><input type="checkbox" id="showYen" ${ui.showYen ? 'checked' : ''}>画像に 金額を出す（外すと DL だけ）</label>
  <button class="btn" id="mkimg">この月を 画像にする</button>
  <div id="imgout"></div></div>
  <p class="note">課金は 手取りの目安（Apple の取り分を引いたあと）、広告は AdMob の推定額です。確定の額は 月の財務レポートと AdMob の支払いが正です。</p>`;
}
async function monthImage() {
  const { rows, tot } = monthRows(ui.month), show = ui.showYen;
  try { await document.fonts.load('900 60px "Zen Maru Gothic"'); await document.fonts.load('500 30px "Zen Maru Gothic"'); } catch {}
  const W = 1080, rowsN = Math.min(rows.length, 8), H = 440 + rowsN * 92 + 50 + 120;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const f = (w, s) => { x.font = `${w} ${s}px "Zen Maru Gothic", sans-serif`; };
  x.fillStyle = '#1F2A44'; x.fillRect(0, 0, W, H);
  [['#FF6B6B', 70], ['#FFD23F', 130], ['#3DDC97', 190]].forEach(([col, px]) => { x.fillStyle = col; x.beginPath(); x.roundRect(px, 70, 44, 44, 10); x.fill(); });
  x.fillStyle = '#4FB8E8'; f(700, 38); x.fillText(`${ui.month.slice(0, 4)}年${+ui.month.slice(5)}月の成績`, 260, 106);
  x.fillStyle = '#fff'; f(900, 150);
  x.fillText(show ? yen(tot.iap + tot.ad) : `${tot.dl.toLocaleString()} DL`, 70, 310);
  f(500, 36); x.fillStyle = '#c9d3ea';
  x.fillText(show ? `課金 ${yen(tot.iap)} ＋ 広告 ${yen(tot.ad)}　｜　${tot.dl.toLocaleString()} ダウンロード` : `アプリ ${rows.length}本の ダウンロードの合計`, 70, 380);
  x.fillStyle = 'rgba(255,255,255,.08)'; x.beginPath(); x.roundRect(50, 440, W - 100, rowsN * 92 + 50, 28); x.fill();
  const max = Math.max(1, ...rows.map(r => show ? r.iap + r.ad : r.dl));
  rows.slice(0, 8).forEach((r, i) => {
    const y = 510 + i * 92, v = show ? r.iap + r.ad : r.dl;
    x.fillStyle = '#fff'; f(700, 38); x.textAlign = 'left'; let nm = r.name; while (x.measureText(nm).width > 520 && nm.length > 2) nm = nm.slice(0, -2) + '…'; x.fillText(nm, 90, y);
    x.textAlign = 'right'; f(900, 40); x.fillText(show ? yen(v) : `${v} DL`, W - 90, y);
    if (show) { f(500, 26); x.fillStyle = '#9aa6c4'; x.fillText(`${r.dl} DL`, W - 300, y); }
    x.textAlign = 'left'; x.fillStyle = '#4FB8E8'; x.beginPath(); x.roundRect(90, y + 16, Math.max(8, (W - 180) * v / max), 10, 5); x.fill();
  });
  x.fillStyle = '#9aa6c4'; f(500, 30); x.fillText('ケセラセラ｜パパが作るゲームとアプリ', 70, H - 60);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const url = URL.createObjectURL(blob), name = `seiseki-${ui.month}.png`;
  $('#imgout').innerHTML = `<img src="${url}" alt="${ui.month} の成績" style="width:100%;border-radius:12px;margin-top:12px"><button class="btn" id="share">保存・共有する</button><div class="sub">うまく開かないときは 画像を長押しして保存できます。</div>`;
  $('#share').onclick = async () => {
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); } catch {} }
    else { const a = document.createElement('a'); a.href = url; a.download = name; a.click(); }
  };
}

// ── 印 ─────────────────────────────
function marksCard() {
  const end = D.ads_through || lastDay(), from = addDays(end, -27);
  const list = MARKS.filter(m => m.d >= from).sort((a, b) => b.d.localeCompare(a.d));
  return `<div class="card"><h2>印（グラフの点線）</h2><div class="marks">${list.length ? list.map(m => `${md(m.d)}　${esc(m.t)}${m.src === 'me' ? `<button data-delmark="${esc(m.d + '|' + m.t)}">消す</button>` : ''}`).join('<br>') : 'この28日には まだありません。'}</div>
  <label>動画を出した・版を出した などを足す</label><input type="date" id="md" value="${new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10)}"><input id="mt" placeholder="例：TikTok まなびの動画" maxlength="30">
  <button class="btn ghost" id="addmark">印を足す</button></div>`;
}

// ── 描く ─────────────────────────────
function render() {
  ls.set(K.ui, ui);
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === ui.tab));
  main.innerHTML = ({ today, app: appTab, country: countryTab, month: monthTab })[ui.tab]();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-t],[data-app],[data-range],[data-month],[data-go],[data-delmark],#addmark,#mkimg,#reload');
  if (!t) return;
  if (t.id === 'reload') return load();
  if (!D) return;
  if (t.dataset.t) { ui.tab = t.dataset.t; scrollTo(0, 0); }
  else if (t.dataset.app) ui.app = t.dataset.app;
  else if (t.dataset.range) ui.range = +t.dataset.range;
  else if (t.dataset.month) ui.month = t.dataset.month;
  else if (t.dataset.go) { ui.app = t.dataset.go; ui.tab = 'app'; scrollTo(0, 0); }
  else if (t.dataset.delmark) { const mine = ls.get(K.marks, []).filter(m => m.d + '|' + m.t !== t.dataset.delmark); ls.set(K.marks, mine); MARKS = MARKS.filter(m => m.src !== 'me' || m.d + '|' + m.t !== t.dataset.delmark); }
  else if (t.id === 'addmark') { const d = $('#md').value, tx = $('#mt').value.trim(); if (!d || !tx) return; const mine = ls.get(K.marks, []); mine.push({ d, t: tx }); ls.set(K.marks, mine); MARKS.push({ d, t: tx, src: 'me' }); }
  else if (t.id === 'mkimg') { ui.showYen = $('#showYen').checked; ls.set(K.ui, ui); return monthImage(); }
  render();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && D && Date.now() - new Date(D.updated) > 3 * 3600e3) load(); });
load();
</script>
</body>
</html>
