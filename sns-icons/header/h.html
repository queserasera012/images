<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}body{font-family:"Zen Maru Gothic";overflow:hidden}
.c{position:relative;overflow:hidden;background:radial-gradient(circle at 70% 40%,#7FD0F2 0,#4FB8E8 60%,#3FA6D9 100%)}
.blk{position:absolute;border-radius:22%;opacity:.9}
.t{position:absolute;color:#fff}
.t h1{font-weight:900;color:#1F2A44;letter-spacing:.04em;text-shadow:0 4px 0 rgba(255,255,255,.55)}
.t p{font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(31,42,68,.35)}
.icons{display:flex}.icons img{border-radius:22%;box-shadow:0 4px 0 rgba(31,42,68,.25);border:3px solid #fff}
.sub{display:inline-block;white-space:nowrap;background:#FFFDF6;color:#1F2A44;font-weight:700;border-radius:99px;border:3px solid #1F2A44}
.dot{position:absolute;border-radius:50%;background:#fff;opacity:.18}
</style></head><body><div class="c" id="c"></div>
<script>
const q=new URLSearchParams(location.search),W=+q.get('w'),H=+q.get('h'),L=q.get('l');
const c=document.getElementById('c');c.style.width=W+'px';c.style.height=H+'px';
const s=H/500;
const add=(h)=>c.insertAdjacentHTML('beforeend',h);
[[.08,.12,180],[.55,.85,260],[.92,.1,150],[.35,-.1,120]].forEach(([x,y,r])=>add(`<div class="dot" style="left:${x*W-r*s}px;top:${y*H-r*s}px;width:${2*r*s}px;height:${2*r*s}px"></div>`));
const blocks=L=='x'?[[560,40,44,'#FFD23F',-12],[1010,410,38,'#FF6B6B',14],[930,60,30,'#3DDC97',20],[470,420,30,'#FF6B6B',-8],[1440,430,40,'#FFD23F',10]]
:[[150,70,50,'#FFD23F',-12],[1150,560,46,'#FF6B6B',14],[700,40,34,'#3DDC97',20],[90,520,40,'#FF6B6B',-8],[600,600,32,'#FFD23F',10]];
blocks.forEach(([x,y,z,col,r])=>add(`<div class="blk" style="left:${x}px;top:${y}px;width:${z}px;height:${z}px;background:${col};transform:rotate(${r}deg);border:4px solid #1F2A44"></div>`));
const ic=['manabi','karakuri','tiny','bounce','aruquest','diner'];
if(L=='x'){
 add(`<img src="sera.svg" style="position:absolute;left:1120px;top:70px;height:400px">`);
 add(`<img src="small.svg" style="position:absolute;left:1330px;top:255px;height:200px">`);
 add(`<div class="t" style="left:470px;top:105px;width:700px">
 <h1 style="font-size:96px;line-height:1.05">ケセラセラ</h1>
 <p style="font-size:40px;margin:14px 0 22px">パパが作る ゲームとアプリ</p>
 <div class="icons" style="gap:12px">${ic.map(n=>`<img src="${n}-icon.png" width="60" height="60">`).join('')}
 <span class="sub" style="font-size:21px;padding:14px 18px;margin-left:4px;align-self:center">＋ LINEスタンプ</span></div></div>`);
}else{
 add(`<img src="sera.svg" style="position:absolute;left:850px;top:120px;height:450px">`);
 add(`<img src="small.svg" style="position:absolute;left:1080px;top:340px;height:220px">`);
 add(`<div class="t" style="left:150px;top:170px;width:700px">
 <h1 style="font-size:110px;line-height:1.05">ケセラセラ</h1>
 <p style="font-size:46px;margin:16px 0 28px">パパが作る ゲームとアプリ</p>
 <div class="icons" style="gap:16px">${ic.map(n=>`<img src="${n}-icon.png" width="80" height="80">`).join('')}</div>
 <div style="margin-top:20px"><span class="sub" style="font-size:26px;padding:8px 22px">知育アプリ・ゲーム・LINEスタンプ</span></div></div>`);
}
</script></body></html>
