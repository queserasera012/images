<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>モコの えいごポスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Mochiy+Pop+One&display=swap">
<style>
/* 1画面アプリ。上が内容、下に3つのタブ（てがみ・たび・おうち）。内容は縦スクロール。 */
:root{
  --paper:#fbf3e4; --card:#fffaf0; --post:#fffdf6; --rpost:#eef5fb; --pline:#cdb78f; --ink:#3b2f2a; --muted:#8a7868;
  --stamp:#d9534a; --sky:#4f9bd6; --leaf:#5aa86c; --line:#e4d6bf; --new:#fde28a; --lock:#d9cfbf;
  --font-ja:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  --font-title:'Mochiy Pop One',var(--font-ja);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1e2430; --card:#2a3141; --post:#2d3344; --rpost:#273040; --pline:#4a5366; --ink:#f3ecdf; --muted:#b2a898; --stamp:#f07a70; --sky:#7fbdf0; --leaf:#7fc78f; --line:#3c4556; --new:#8a6d12; --lock:#3c4556; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#1e2430; --card:#2a3141; --post:#2d3344; --rpost:#273040; --pline:#4a5366; --ink:#f3ecdf; --muted:#b2a898; --stamp:#f07a70; --sky:#7fbdf0; --leaf:#7fc78f; --line:#3c4556; --new:#8a6d12; --lock:#3c4556; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ja);font-size:17px;line-height:1.6;margin:0;padding:0 16px;display:flex;flex-direction:column;min-height:100%}
main{flex:1;max-width:520px;width:100%;margin:0 auto;padding-block:14px 90px;display:grid;gap:14px;align-content:start}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;gap:6px;padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:160px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:.85rem;padding:6px 0;border-radius:12px;cursor:pointer;line-height:1.2}
nav button span{display:block;font-size:1.5rem}
nav button[aria-selected="true"]{color:var(--stamp);background:var(--paper)}
nav button:focus-visible,.btn:focus-visible,.tile:focus-visible,.key:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1{font-family:var(--font-title);font-weight:400;font-size:1.4rem;margin:0;color:var(--stamp);line-height:1.3;text-wrap:balance}
h2{font-size:1.05rem;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:0}
#kids{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 16px 0;max-width:560px;margin:0 auto}
#kids .kid{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
#kids .kid.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
#kids .kid.add{color:var(--muted);border-style:dashed}
.ptabs{display:flex;border-bottom:2px solid var(--line);margin:4px 0 2px}
.ptabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:.9rem;padding:8px 2px;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--stamp)}
.ppane{display:grid;gap:14px}.ppane[hidden]{display:none}
#pkids{display:flex;gap:6px;overflow-x:auto}#pkids .kid{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap}#pkids .kid.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
.btn{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;font-size:.95rem;cursor:pointer}
.btn.on{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.main{background:var(--stamp);border-color:var(--stamp);color:#fff;font-size:1.1rem;padding:12px 22px}
.btn.big{font-size:1.2rem;padding:14px 26px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.center{text-align:center;justify-content:center}
/* 封筒：CSS で描く。とどく（上から落ちて はずむ）→ ゆれる → ひらく（ふたが開いて 手紙が せり出す）→ きらきら → はがきへ */
.envwrap{position:relative;height:230px;display:grid;place-items:center;cursor:pointer;perspective:800px;overflow:visible}
.env{position:relative;width:200px;height:130px;transform-style:preserve-3d;animation:arrive .9s cubic-bezier(.34,1.56,.64,1) both, float 2.6s ease-in-out .9s infinite}
.env-letter{position:absolute;left:14px;right:14px;top:10px;height:110px;background:var(--post);border:2px solid var(--pline);border-radius:8px;display:grid;gap:9px;padding:14px 12px 0;box-sizing:border-box;transition:transform .7s cubic-bezier(.2,.9,.3,1.1)}
.env-letter i{display:block;height:6px;border-radius:3px;background:var(--pline);opacity:.55}
.env-letter i:nth-child(1){width:55%} .env-letter i:nth-child(2){width:85%} .env-letter i:nth-child(3){width:70%}
.env-body{position:absolute;inset:0;background:linear-gradient(180deg,#f3d9a6,#e8c88b);border:2px solid var(--pline);border-radius:10px;box-sizing:border-box;clip-path:polygon(0 0,50% 48%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:66px;background:linear-gradient(180deg,#f7e3b9,#ecd3a0);border:2px solid var(--pline);border-top-width:2px;box-sizing:border-box;border-radius:10px 10px 0 0;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .55s ease-in;backface-visibility:hidden}
.env-seal{position:absolute;left:50%;top:50px;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;background:var(--stamp);color:#fff;display:grid;place-items:center;font-size:1.2rem;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:opacity .3s,transform .3s}
.env-stamp{position:absolute;right:10px;top:8px;width:34px;height:40px;background:#fff;border:2px dashed var(--pline);border-radius:3px;display:grid;place-items:center;font-size:1.1rem;transform:rotate(6deg)}
.env-addr{position:absolute;left:16px;bottom:12px;font-family:var(--font-title);font-size:.85rem;color:#8a6a3a;letter-spacing:.02em}
.env-addr b{font-weight:400;font-size:1.35rem;color:#5a3a1a;margin-left:4px}
/* 子どもの名前は 大きく（2026-10-17・オーナー「あなたのために送ってるよ感」） */
.toname{font-family:var(--font-title);font-size:1.9rem;color:var(--stamp);margin:0;line-height:1.2}
.nm{font-family:var(--font-title);font-size:1.25em;color:var(--stamp)}
.envwrap.opening .env{animation:none;transform:translateY(10px)}
.envwrap.opening .env-flap{transform:rotateX(-178deg);transition-delay:0s}
.envwrap.opening .env-seal{opacity:0;transform:translateX(-50%) scale(.3)}
.envwrap.opening .env-letter{transform:translateY(-112px) scale(1.06);transition-delay:.45s;z-index:3;box-shadow:0 10px 24px rgba(60,40,20,.18)}
.envwrap.gone{animation:vanish .35s ease-in forwards}
.spk{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:var(--new);opacity:0;pointer-events:none}
.envwrap.opening .spk{animation:spark .9s ease-out .7s forwards}
.spk:nth-child(2n){background:var(--stamp)} .spk:nth-child(3n){background:var(--sky)} .spk:nth-child(5n){background:var(--leaf)}
.spk:nth-child(1){--dx:-90px;--dy:-80px} .spk:nth-child(2){--dx:70px;--dy:-100px} .spk:nth-child(3){--dx:-120px;--dy:-10px} .spk:nth-child(4){--dx:120px;--dy:-30px}
.spk:nth-child(5){--dx:-60px;--dy:60px} .spk:nth-child(6){--dx:80px;--dy:70px} .spk:nth-child(7){--dx:0;--dy:-130px} .spk:nth-child(8){--dx:-130px;--dy:-60px}
.spk:nth-child(9){--dx:130px;--dy:-80px} .spk:nth-child(10){--dx:20px;--dy:90px}
@keyframes arrive{0%{transform:translateY(-260px) rotate(-14deg);opacity:0}60%{opacity:1}100%{transform:translateY(0) rotate(0);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2)}}
@keyframes vanish{to{opacity:0;transform:scale(.9) translateY(-20px)}}
.postcard.arrive{animation:pcin .6s cubic-bezier(.2,.9,.3,1.05) both}
@keyframes pcin{from{opacity:0;transform:translateY(40px) rotate(-1deg) scale(.96)}to{opacity:1;transform:rotate(-.6deg)}}
.pen{display:inline-block;animation:pen .8s ease-in-out infinite}
@keyframes pen{0%,100%{transform:translate(0,0) rotate(-20deg)}50%{transform:translate(6px,-3px) rotate(-14deg)}}
@media (prefers-reduced-motion: reduce){ .env,.envwrap.gone,.postcard.arrive,.pen,.spk{animation:none!important} .env-flap,.env-letter,.env-seal{transition:none} .drop{animation:none} }
.pic{font-size:5rem;line-height:1.1;text-align:center}
/* 場所の絵（art/<day>.jpg）。無ければ onerror で絵文字に戻る */
.pic.art{font-size:0}.pic.art img{width:100%;max-width:300px;aspect-ratio:1;object-fit:cover;border-radius:12px;border:2px solid var(--pline);box-shadow:0 3px 0 rgba(60,40,20,.12)}
.post .pic.art img{max-width:150px}.pc .e img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.place{display:flex;gap:10px;align-items:center}
.day{font-family:var(--font-title);color:#fff;background:var(--sky);border-radius:999px;padding:2px 12px;font-size:.9rem;white-space:nowrap}
.en{font-size:1.3rem;line-height:1.7;display:grid;gap:6px}
.l0 .en{font-size:1.8rem}
.en p{margin:0;cursor:pointer}
[hidden]{display:none!important}
.en p .jp{display:block;font-size:.85rem;color:var(--muted);font-weight:500}
.nw{background:var(--new);border-radius:6px;padding:0 4px;border-bottom:2px dotted var(--stamp)}
.q{background:var(--paper);border-radius:12px;padding:10px 12px;margin:0}
.q b{color:var(--stamp);font-size:.8rem;display:block}
.q span{font-size:1.2rem}
.line{min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:8px 10px;font-size:1.2rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.line .ph{color:var(--muted);font-size:.9rem}
.chip{background:var(--leaf);color:#fff;border-radius:8px;padding:2px 10px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
/* レベル2〜3：文の型＋穴 */
.frames{display:grid;gap:8px}
.frame{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--paper);color:var(--ink);font:inherit;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.frame b{font-size:1.1rem;font-weight:700}.frame small{color:var(--muted);font-size:.85rem}
.frame:disabled{opacity:.4}
.slot{display:inline-block;min-width:44px;text-align:center;background:var(--new);color:var(--ink);border:2px dashed var(--pline);border-radius:8px;padding:0 10px;cursor:pointer}
.slot.on{border-style:solid;border-color:var(--stamp);box-shadow:0 0 0 3px rgba(217,83,74,.2)}
.slot.ok{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.slot.obj{min-width:0;border-color:var(--muted);color:var(--muted);background:transparent;font-size:.85em;padding:0 8px}.slot.obj.ok{background:var(--leaf);color:#fff;border-color:var(--leaf);font-size:1em}
.skipobj{border:2px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:4px 12px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;margin-left:auto}
.sent{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.btabs{display:flex;gap:6px}.btabs button{border:2px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:4px 12px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.btabs button.on{background:var(--sky);border-color:var(--sky);color:#fff}
.tile .te{margin-right:4px}.tile small{display:block;font-size:.7rem;color:var(--muted);line-height:1.1}
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.dict button{border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;font-size:.85rem;padding:6px 4px;cursor:pointer}
.dict button span{display:block;font-size:1.4rem}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.choice{border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--paper);color:var(--ink);font:inherit;padding:12px 8px;display:grid;gap:4px;justify-items:center;cursor:pointer}
.choice .ce{font-size:2.6rem;line-height:1.1}
.choice .cen{font-size:1.05rem;font-weight:700}
.choice .cja{font-size:.8rem;color:var(--muted)}
.choice.picked{border-color:var(--leaf);background:var(--card)}
.choice:disabled:not(.picked){opacity:.4}
.q small{display:block;font-size:.85rem}
.tile{background:var(--paper);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:8px 14px;font:inherit;font-size:1.1rem;cursor:pointer}
.l0 .tile{font-size:1.4rem;padding:12px 20px}
.tile:active{border-bottom-width:2px;transform:translateY(2px)}
.order{margin-top:8px;background:var(--post);border:2px solid var(--pline);border-radius:12px;padding:10px}.order .olab{font-size:.9rem;color:var(--muted);margin-bottom:6px}
.order .built{min-height:46px;border:2px dashed var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:1.15rem}
.order .built .w{background:var(--leaf);color:#fff;border-radius:8px;padding:0 10px;cursor:pointer}.order .built .w.ng{background:var(--stamp)}.order .built .w.hint{background:transparent;color:var(--muted);border:2px dashed var(--line)}
.order .pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.order .pool .tile{font-size:1.05rem;padding:6px 12px}
.order .omsg{margin-top:6px;font-size:.95rem}.order .omsg.ok{color:var(--leaf);font-weight:700}.order .omsg.ng{color:var(--stamp)}
.moco{background:var(--paper);border-radius:14px;padding:12px 14px;font-size:1.1rem;display:flex;gap:10px;align-items:flex-start}
.moco .face{font-size:1.8rem;line-height:1}
.moco .mt{cursor:pointer}
.likes{grid-template-columns:repeat(4,1fr);gap:6px}.likes .choice{padding:6px 2px}.likes .ce{font-size:1.7rem}.likes .choice.on{outline:3px solid var(--leaf);background:var(--new)}.likes .cja{font-size:.8rem}
.fix{background:#fff7e6;color:#3b2f2a;border:2px dashed #e8b86d;border-radius:14px;padding:10px 14px;margin-top:10px}.fix b.lab{display:block;font-size:.85rem;color:#8a5a1a;margin-bottom:4px}.fix .fx{font-size:1.15rem;font-weight:700;color:#3b2f2a;cursor:pointer}.fix .fx mark{background:#ffd54f;color:#3b2f2a;border-radius:4px;padding:0 3px}.fix .tip{display:block;font-size:.95rem;color:#5a4a40;margin-top:4px}
.moco .jp{display:block;font-size:.85rem;color:var(--muted);font-weight:500;margin-top:4px}
.post{border:3px solid var(--stamp);border-radius:14px;padding:14px;text-align:center;background:var(--card)}
.drop{animation:drop .7s cubic-bezier(.2,.9,.3,1.2)}
.dots{display:inline-block;animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}
@keyframes drop{from{transform:translateY(-40px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stop{text-align:center;display:grid;gap:4px;justify-items:center}
.stop .dot{width:56px;height:56px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:1.7rem}
.stop.done .dot{border-color:var(--leaf);background:var(--card)}
.stop.now .dot{border-color:var(--stamp);box-shadow:0 0 0 4px rgba(217,83,74,.2)}
.stop.lock .dot{background:var(--lock);color:var(--muted);font-size:1.2rem}
.stop small{font-size:.7rem;color:var(--muted);line-height:1.2}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pc{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:var(--card);display:grid;gap:4px}
.pc.lock{opacity:.45}
.pc .e{font-size:2.4rem;line-height:1.1}
.pc small{font-size:.75rem;color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;width:100%;margin:0 auto}
.key{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);border-radius:14px;font:inherit;font-size:1.6rem;font-weight:700;min-height:60px;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.key:active{transform:translateY(2px);border-bottom-width:2px}
.pinbox{text-align:center;font-size:1.6rem;letter-spacing:.4em;min-height:2.2rem}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:var(--paper);border-radius:12px;padding:10px 4px}
.stat b{display:block;font-family:var(--font-title);font-weight:400;font-size:1.6rem;color:var(--stamp);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.75rem}
.log{font-size:.85rem;color:var(--muted);display:grid;gap:4px;margin:0;padding-left:1.2em}
input.secret{-webkit-text-security:disc}  /* password 型にすると Safari が別のパスワードを勝手に入れることがある。文字型にして見た目だけ伏せる */
select,input{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0;max-width:100%}
label{display:grid;gap:4px;font-size:.9rem}
label.inline{display:flex;gap:8px;align-items:center}
.note{font-size:.8rem;color:var(--muted);margin:0}
.postcard{position:relative;background:var(--post);outline:1px solid var(--pline);outline-offset:-6px;background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(120,90,50,.06) 23px 24px),radial-gradient(rgba(120,90,50,.045) 1px,transparent 1.2px);background-size:auto,9px 9px;border:1px solid var(--pline);border-radius:6px;box-shadow:0 3px 0 var(--pline),0 14px 30px rgba(60,40,20,.16);padding:18px 20px 22px;transform:rotate(-.6deg);margin:6px 2px 10px}
.pchead{display:flex;justify-content:space-between;align-items:flex-start;position:relative;min-height:66px;border-bottom:1.5px solid var(--pline);padding-bottom:8px}
.pcfrom{font-family:var(--font-title);color:var(--stamp);font-size:.95rem;line-height:1.3;padding-top:6px}
.pcfrom small{font-family:var(--font-ja);color:var(--muted);font-weight:500;font-size:.75rem}
.pcstamp{width:50px;height:62px;background:var(--card);border:1px solid var(--pline);outline:3px dashed var(--pline);outline-offset:-5px;display:grid;place-items:center;gap:0;font-size:1.6rem;line-height:1;padding:6px 2px}
.pcstamp small{font-size:.42rem;letter-spacing:.05em;color:var(--muted);font-weight:700;line-height:1}
.pcmark{position:absolute;right:38px;top:14px;width:52px;height:52px;border:2px double var(--muted);border-radius:50%;display:grid;place-items:center;font-size:.6rem;font-weight:700;color:var(--muted);transform:rotate(-14deg);opacity:.7;pointer-events:none;background:transparent;font-family:var(--font-title)}
.pcto{font-family:var(--font-title);font-size:1.4rem;color:var(--stamp)}
.postcard .en p{border-bottom:1.5px dashed var(--pline);padding-bottom:4px}
.postcard .en,.postcard .pcto,.postcard .pic{transform:rotate(.6deg)}
.postcard .q{background:rgba(251,243,228,.9)}
:root[data-theme="dark"] .postcard .q{background:var(--paper)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .postcard .q{background:var(--paper)} :root:not([data-theme="light"]) .replycard .q{background:rgba(255,255,255,.08)} }
:root[data-theme="dark"] .replycard .q{background:rgba(255,255,255,.08)}
.postcard .pic{font-size:4.2rem}
.replycard{background:var(--rpost);background-image:repeating-linear-gradient(135deg,var(--stamp) 0 10px,transparent 10px 20px,var(--sky) 20px 30px,transparent 30px 40px);background-size:100% 6px,auto;background-repeat:no-repeat;background-position:top;border:1px solid var(--pline);border-radius:8px;box-shadow:0 2px 0 var(--pline);padding:18px 16px 16px}

.quiz{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quiz .choice .ce{font-size:3rem}
.star{font-size:1.6rem;text-align:center}

<script src="letters.js"></script>
<script>
(function(){
  var L = window.LETTERS, KEY='moco.post.v1', KIDS='moco.post.kids.v1', PIN='1234';
  // 子どもを 何人でも（2026-10-17・オーナー依頼「他のしんめアプリみたいに」）。K = {cur, kids:{id: S}, shared:{server,token,useAi}}。S は いま えらばれている子の記録のまま
  var K = loadKids();

  // 2026-10-15: 旅が 10か所 → 30か所 になり 順番も変わった。旧セーブの「何日目」の記録を 新しい並びに写す
  (function(){ if(!S || S.tripVer===2) return; var OLD=['tokyo','hawaii','australia','reef','naples','venice','egypt','kenya','paris','london'];
    var to={}; OLD.forEach(function(id,k){ to[k]=L.trip.findIndex(function(t){return t.id===id}); });
    ['done','ai','askedWord','asked','found','jaBy','opened','spBy'].forEach(function(f){ var o=S[f]; if(!o||typeof o!=='object') return; var m={}; Object.keys(o).forEach(function(k){ var j=to[k]; if(j!=null && j>=0) m[j]=o[k]; }); S[f]=m; });
    S.tripVer=2; save(); })();
  function loadKids(){ var k=null; try{ k=JSON.parse(localStorage.getItem(KIDS)||'null'); }catch(e){}
    if(k && k.kids) return k;
    k={cur:null, kids:{}, shared:{}};
    var old=null; try{ old=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
    if(old && old.v===1){ var id=newKidId(); k.kids[id]=old; k.cur=id; k.shared={server:old.server, token:old.token, useAi:old.useAi}; try{ localStorage.setItem(KIDS, JSON.stringify(k)); localStorage.removeItem(KEY); }catch(e){} }
    return k; }
  function newKidId(){ return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function save(){ try{ if(K.cur){ if(S) K.kids[K.cur]=S; else delete K.kids[K.cur]; } localStorage.setItem(KIDS, JSON.stringify(K)); }catch(e){} }
  function kidIds(){ return Object.keys(K.kids); }

  function cancelAdd(){ if(prevKid && K.kids[prevKid]){ K.cur=prevKid; S=K.kids[prevKid]; } else { K.cur=kidIds()[0]||null; S=K.cur?K.kids[K.cur]:null; } prevKid=null; render(); }
  function removeKid(id){ delete K.kids[id]; if(K.cur===id){ K.cur=kidIds()[0]||null; S=K.cur?K.kids[K.cur]:null; } save(); }
  // 子を ついかしている あいだ（S が null・prevKid あり）も 出す：いまの子が 消えたように 見えた（2026-10-19 オーナー）。なまえを おすと ついかを やめて その子に もどる
  function renderKidsBar(){ var el=document.getElementById('kids'); var ids=kidIds(); var adding=!S && !!prevKid; var show = adding || (tab==='letter' && (ids.length>=2 || (ids.length===1 && S)));
    if(!show){ el.hidden=true; el.innerHTML=''; return; }
    el.hidden=false; el.innerHTML = ids.map(function(id){ return '<button class="kid'+(id===K.cur?' on':'')+'" data-id="'+id+'">'+esc(kidName(id))+'</button>'; }).join('')+'<button class="kid add" data-add="1">＋ ついか</button>';
    el.querySelectorAll('.kid').forEach(function(b){ b.onclick=function(){ if(b.dataset.add){ if(!adding) addKid(); } else if(adding){ prevKid=b.dataset.id; cancelAdd(); } else if(b.dataset.id!==K.cur) switchKid(b.dataset.id); }; }); }
  function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function daysSince(iso){ var a=new Date(iso+'T00:00:00'), b=new Date(today()+'T00:00:00'); return Math.round((b-a)/86400000); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
  function plain(s){ return s.replace(/[{}]/g,''); }
  function mark(s, words){ return nameMark(esc(s).replace(/\{([^}]+)\}/g,function(_,w){ return '<span class="nw">'+w+'</span>'; })); }
  // 文の中の 子どもの名前を 大きく。esc 済みの HTML に掛ける（名前も esc してから探す）
  function nameMark(h){ var ns=[S&&S.name, S&&S.nameJa].filter(function(n){return n&&n.length>=2}); ns.forEach(function(n){ var e=esc(n).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); h=h.replace(new RegExp('(^|[^\\w>])('+e+')(?=$|[^\\w\\p{sc=Hiragana}\\p{sc=Katakana}\\p{sc=Han}]|[はへがのもにと]|くん|ちゃん)','gu'), function(_,a,b){ return a+'<span class="nm">'+b+'</span>'; }); }); return h; }  // 「そう」が「そうだね」に当たらないよう、名前の後ろは 記号・助詞・くん/ちゃん だけ
  function pickVoice(){ var vs=speechSynthesis.getVoices().filter(function(v){return /^en[-_]/.test(v.lang)}); if(!vs.length) return null;
    var score=function(v){ var n=v.name, s=0; if(/^en[-_]US/.test(v.lang)) s+=4; if(/Enhanced|Premium|Natural|Neural/i.test(n)) s+=6; if(/Samantha|Ava|Allison|Zoe|Nicky|Karen|Moira|Serena|Google US English/i.test(n)) s+=3; if(/Compact|Eloquence|Fred|Albert|Bad News|Bells|Boing|Bubbles|Cellos|Jester|Organ|Trinoids|Whisper|Wobble|Zarvox/i.test(n)) s-=10; if(v.localService) s+=1; return s; };
    return vs.sort(function(a,b){return score(b)-score(a)})[0]; }
  // speak(text, onDone): 読み終わったら onDone を1回だけ呼ぶ（読めない端末でも呼ぶ）。
  // 読み上げを「取り消して次を読む」作りなので、続けて読むときは onDone の中で次を speak する
  function speak(text, onDone){ var done=false; function fin(){ if(done) return; done=true; if(onDone) onDone(); }
    if(!('speechSynthesis' in window)){ setTimeout(fin,600); return; } speechSynthesis.cancel();
    // 文ごとに分けて読む（間が入る）。記号と絵文字は読まない（「.」を dot、🐢 を turtle と読む端末がある）。国旗（🇯🇵）は Extended_Pictographic に入らないので Regional_Indicator と So も落とす（2026-10-15）
    var parts=String(text).replace(/[{}"]/g,'').replace(/[\p{Extended_Pictographic}\p{Regional_Indicator}\p{So}\u{FE00}-\u{FE0F}\u{200D}\u{1F3FB}-\u{1F3FF}\u{20E3}\u{E0020}-\u{E007F}]/gu,' ').split(/(?<=[.!?])\s+/).map(function(x){return x.replace(/[.!?,]+/g,' ').replace(/\s+/g,' ').trim()}).filter(Boolean);
    var v=pickVoice();
    if(!parts.length){ setTimeout(fin,300); return; }
    parts.forEach(function(pt,idx){ var u=new SpeechSynthesisUtterance(pt); u.lang='en-US'; u.rate=0.82; u.pitch=1.08; if(v) u.voice=v;
      if(idx===parts.length-1){ u.onend=function(){ setTimeout(fin,250); }; u.onerror=function(){ setTimeout(fin,250); }; }
      speechSynthesis.speak(u); });
    // onend が来ない端末のための保険（1文字 120ms + 2秒）
    setTimeout(fin, 2000 + String(text).length*120); }
  if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=function(){}; }

  // --- 進み具合 ---
  function maxIndex(){ return Math.min(daysSince(S.start)+S.extra, L.trip.length-1); }
  function todayIndex(){ for(var i=0;i<=maxIndex();i++){ if(!S.done[i]) return i; } return maxIndex(); }
  function aiAt(i){ var a=S.ai&&S.ai[i]; return a&&a.level===S.level ? a.letter : null; }
  function fixedLetter(i){ var t=L.trip[i], k=L.fixedIndex[t.id]; return (k!=null && L.levels[S.level].letters[k]) || genericLetter(S.level, t); }
  function letterAt(i){ return aiAt(i) || fixedLetter(i); }
  // きまった手紙が無い場所（11〜30）用の、scene と fact から組む手紙。本番は AI が書く
  function genericLetter(lv, t){
    var a=t.scene[0], b=t.scene[1], c=t.scene[2], f=t.fact||{en:'',ja:''};
    var ch=function(o,m,mja){ return {e:o.e,en:o.en.charAt(0).toUpperCase()+o.en.slice(1)+'!',ja:o.ja,m:m,mja:mja}; };
    if(lv===0) return {pic:t.emoji, en:['Hello!','I am in '+t.en+'.','I see a '+a.en+'!'], ja:['こんにちは！',t.place+' に いるよ。',a.ja+' が みえる！'], words:{}, q:'Which do you like?', qja:'どっちが すき？',
      choices:[ch(a,'Me too! I like the '+a.en+'!','ぼくも！ '+a.ja+' が すき！'), ch(b,'Me too! I like the '+b.en+'!','ぼくも！ '+b.ja+' が すき！')]};
    if(lv===1){ var w={}; w[a.en]=a.ja; return {en:['Hello! I am Moco.','Today I am in '+t.en+'.','I see a {'+a.en+'}!','I like the '+b.en+'.'], ja:['こんにちは！ ぼく モコ。','きょう は '+t.place+' に いるよ。',a.ja+' が みえる！',b.ja+' が すき。'], words:w, q:'Do you like the '+a.en+'?', qja:a.ja+' すき？',
      choices:[{e:'😊',en:'Yes! I like it.',ja:'うん、すき', m:'Me too! '+f.en, mja:'ぼくも！ '+f.ja},{e:'🤔',en:'No. I like the '+b.en+'.',ja:'ううん、'+b.ja+' が すき', m:'OK! The '+b.en+' is nice too!', mja:'そっか！ '+b.ja+' も いいね！'},{e:c.e,en:'I like the '+c.en+'!',ja:c.ja+' が すき！', m:'Me too! I see a '+c.en+' here!', mja:'ぼくも！ ここ に '+c.ja+' が あるよ！'}]}; }
    if(lv===2){ var w2={}; w2[a.en]=a.ja; return {en:['Hello! I am Moco.','Today I am in '+t.en+'.','I see a {'+a.en+'} and a '+b.en+'.',f.en], ja:['こんにちは！ ぼく モコ。','きょう は '+t.place+' に いるよ。',a.ja+' と '+b.ja+' が みえる。',f.ja], words:w2, q:'What do you want to see?'}; }
    var w3={}; w3[a.en]=a.ja; w3[c.en]=c.ja;
    return {en:['Hello! I am Moco.','Today I am in '+t.en+'.','I see a {'+a.en+'}, a '+b.en+', and a {'+c.en+'}.',f.en,'What do you think?'], ja:['こんにちは！ ぼく モコ。','きょう は '+t.place+' に いるよ。',a.ja+' と '+b.ja+' と '+c.ja+' が みえる。',f.ja,'きみは どう おもう？'], words:w3, q:'What do you want to see here, and why?'};
  }
  function tripAt(i){ var a=aiAt(i), t=L.trip[i]; return a ? Object.assign({}, t, {scene:a.scene&&a.scene.length?a.scene:t.scene, asks:a.asks&&a.asks.length?a.asks:t.asks}) : t; }
  // --- サーバー（Cloudflare Workers → Claude）。住所と合言葉は おうち画面で入れる。API キーは ここには無い ---
  function aiOn(){ return !!(S.useAi && S.server && S.token); }
  function api(path, body){
    var url=String(S.server||'').replace(/\/+$/,'')+path;
    // 手紙1通は 20〜60秒かかる（作り直しが入ると倍）。45秒で切っていたのが「つながらない」の主因だった（2026-10-15）
    var ctl=new AbortController(); var tm=setTimeout(function(){ctl.abort()}, 100000); var t0=Date.now();
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.token},body:JSON.stringify(body),signal:ctl.signal})
      .then(function(r){ clearTimeout(tm); return r.json().then(function(j){ if(!r.ok) throw new Error((j.error||('http '+r.status))+(j.status?' '+j.status:'')+(j.detail?'：'+j.detail:'')); j._ms=Date.now()-t0; return j; }); },
            function(e){ clearTimeout(tm); throw new Error(e&&e.name==='AbortError' ? 'timeout（100秒 まっても 返事が なかった）' : 'network（'+String(e&&e.message||e)+'）'); });
  }
  function knownWords(){ var k={}; Object.keys(S.done).forEach(function(d){ (S.done[d].newWords||[]).forEach(function(w){k[w.toLowerCase()]=1}); }); return Object.keys(k); }
  // {name} を名前に置き換える。日本語の欄（ja・qja・aja・mja・mocoJa …）は「にほんごの なまえ」（無ければ なまえ）。
  // 「こんにちは Sosuke！」のように 日本語の中に ローマ字が出るのを避ける（2026-10-15）
  function nameFill(x, key){ var n=(key&&/ja$/i.test(key)&&S.nameJa) ? S.nameJa : (S.name||'friend'); if(typeof x==='string') return x.replace(/\{name\}/g,n); if(Array.isArray(x)) return x.map(function(v){return nameFill(v,key)}); if(x&&typeof x==='object'){ var o={}; Object.keys(x).forEach(function(k){o[k]=nameFill(x[k],k)}); return o; } return x; }
  // 累計メーター：「さいしょから」で消えない（原価の実測用・2026-10-15）。セーブとは別のキー
  var METER='moco.post.meter';
  function meterAdd(what, usage, ms){ try{ var m=JSON.parse(localStorage.getItem(METER)||'{}'); m.calls=(m.calls||0)+1; m[what]=(m[what]||0)+1; m.tin=(m.tin||0)+((usage||{}).input_tokens||0); m.tout=(m.tout||0)+((usage||{}).output_tokens||0); if(ms){ m.msSum=(m.msSum||0)+ms; m.msN=(m.msN||0)+1; } m.since=m.since||today(); localStorage.setItem(METER, JSON.stringify(m)); }catch(e){} }
  function meterText(){ try{ var m=JSON.parse(localStorage.getItem(METER)||'{}'); if(!m.calls) return ''; return '📟 累計（「さいしょから」でも消えない・'+(m.since||'')+' から）：呼んだ回数 '+m.calls+'（手紙 '+(m.letter||0)+'・返事 '+(m.reply||0)+'）／ トークン 入 '+(m.tin||0)+'・出 '+(m.tout||0)+(m.msN?'／ 手紙1通 平均 '+Math.round(m.msSum/m.msN/1000)+'秒':''); }catch(e){ return ''; } }
  function fetchLetter(i){
    var t=tripAt(i);
    var recent=Object.keys(S.done).map(Number).sort(function(a,b){return a-b}).slice(-3).map(function(k){ return {day:L.trip[k].day, place:L.trip[k].en, reply:S.done[k].reply.join(' ')}; });
    return api('/letter',{level:S.level, day:t.day, place:t.place, placeEn:t.en, known:knownWords(), recent:recent, sceneWords:(t.scene||[]).map(function(o){return o.en}), fact:(t.fact||{}).en||'', interests:interests()}).then(function(j){
      var lt=nameFill(j.letter); lt.ja=(lt.ja||[]).map(plain); if(S.level>=2||!lt.choices||!lt.choices.length) lt.choices=null; lt.tiles=S.level>=2&&lt.tiles?lt.tiles:[];
      if(S.level<=1 && !lt.choices) throw new Error('no_choices'); if(S.level>=2 && !(lt.frames&&lt.frames.length>=2) && lt.tiles.length<4) throw new Error('no_frames');
      S.ai=S.ai||{}; S.ai[i]={level:S.level, letter:lt, at:today(), usage:j.usage, off:j.off_list, ms:j._ms}; S.aiLog=(S.aiLog||[]).concat([{at:today(),what:'letter',day:t.day,usage:j.usage,ms:j._ms}]).slice(-30); meterAdd('letter', j.usage, j._ms); save(); return lt;
    });
  }
  // あしたの手紙を いまのうちに作っておく（へんじを出したあと・アプリを開いたとき）。
  // 朝ひらいた瞬間に 60秒待たせない・待っている間に時間切れにならない ための作り
  var prefetching=null;
  function prefetchNext(){
    if(!aiOn()) return; var n=todayIndex(); if(S.done[n]) n=n+1; if(n>=L.trip.length || aiAt(n) || prefetching===n) return;
    if(!S.done[n-1] && n>0) return;  // きょうの手紙が まだなら、あしたの分は作らない
    prefetching=n; fetchLetter(n).then(function(){ prefetching=null; }, function(e){ prefetching=null; S.aiErr='（さきよみ）'+String(e&&e.message||e); save(); });
  }
  function fetchReply(i, lt, words){
    var nx = i < L.trip.length-1 ? L.trip[i+1].en : 'home';
    return api('/reply',{level:S.level, letter:lt.en.map(plain), reply:words.join(' '), nextPlaceEn:nx, interests:interests()}).then(function(j){
      S.aiLog=(S.aiLog||[]).concat([{at:today(),what:'reply',day:L.trip[i].day,usage:j.usage}]).slice(-30); meterAdd('reply', j.usage); save(); return nameFill(j.reply);
    });
  }
  function writing(){ return '<div class="card"><div class="moco"><span class="face">🐾</span><div class="mt">モコが かいてる<span class="dots">…</span></div></div></div>'; }
  // 「モコなら こう かくよ」：子の文と AI の fixed が違うときだけ出す。違う語に印（2026-10-16・オーナー「間違えてると気づけないのは可哀想」）
  function normW(t){ return String(t||'').toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean); }
  function sameSent(a,b){ return normW(a).join(' ')===normW(b).join(' '); }
  function fixBox(sent, fixed, tip){ if(!fixed || sameSent(sent,fixed)) return ''; var had={}; normW(sent).forEach(function(w){had[w]=1}); var html=esc(fixed).split(' ').map(function(w){ var k=w.toLowerCase().replace(/[^a-z']/g,''); return (k&&!had[k]) ? '<mark>'+w+'</mark>' : w; }).join(' '); return '<div class="fix drop"><b class="lab">✏️ モコなら こう かくよ</b><div class="fx" data-say="'+esc(fixed)+'">'+html+'</div>'+(tip?'<span class="tip">'+esc(tip)+'</span>':'')+'</div>'; }
  function mocoBox(en, ja){ return '<div class="moco"><span class="face">🐾</span><div class="mt">'+esc(en)+(ja?'<span class="jp"'+(S.autoJa?'':' hidden')+'>'+esc(ja)+'</span>':'')+'</div></div>'; }
  function mocoReply(i, reply){
    var r = reply.join(' ');
    var next = i < L.trip.length-1 ? L.trip[i+1].en : 'home';
    return [
      r+' Yay! Bye-bye!',
      r+' Me too! I like it. See you tomorrow!',
      'You said "'+r+'". Nice! Moco likes it too. Tomorrow I go to '+next+'!',
      '"'+r+'" Great sentence! I will remember it. Tomorrow I write from '+next+'. Good night!'
    ][S.level];
  }

  // --- レベル2〜3 の返事：文の型 ＋ 穴（有限のまま 言える幅を広げる・2026-10-14） ---
  var VERBS=[{e:'🍽️',en:'eat',ja:'たべる'},{e:'👀',en:'see',ja:'みる'},{e:'🏊',en:'swim',ja:'およぐ'},{e:'⚽',en:'play',ja:'あそぶ'},{e:'😴',en:'sleep',ja:'ねる'},{e:'🚶',en:'go',ja:'いく'},{e:'🏃',en:'run',ja:'はしる'},{e:'🕊️',en:'fly',ja:'とぶ'}];
  var ADJS=[{e:'🐘',en:'big',ja:'おおきい'},{e:'🐜',en:'small',ja:'ちいさい'},{e:'🎉',en:'fun',ja:'たのしい'},{e:'😋',en:'yummy',ja:'おいしい'},{e:'🧸',en:'cute',ja:'かわいい'},{e:'🧊',en:'cold',ja:'つめたい'},{e:'🔥',en:'hot',ja:'あつい'},{e:'🌸',en:'pretty',ja:'きれい'}];

    document.getElementById('more').onclick=function(){ if(maxIndex()<L.trip.length-1){ S.extra++; save(); tab='letter'; render(); } };
    var armed=false; document.getElementById('reset').onclick=function(){ if(!armed){ armed=true; this.textContent='ほんとうに けす？（もう一度おす）'; return; } S=null; save(); tab='letter'; render(); };  // save() は S が null なら この子を消す。K.cur は残るので そのまま 作りなおしになる
  }
  function renderParent(){
    if(!pinOK){
      app.innerHTML = '<h1>👪 おうちの ひと</h1><p class="sub">あんしょうばんごう を いれてください（試作は 1234）</p>'+
        '<div class="card"><div class="pinbox" id="pb"></div><div class="keys">'+'123456789'.split('').map(function(k){return '<button class="key">'+k+'</button>'}).join('')+'<button class="key" data-x="1">←</button><button class="key">0</button><button class="key" data-ok="1">OK</button></div></div>'+
        protoButtonsHtml()+'<p class="note">テスト中だけ ここに出しています。本物では あんしょうばんごう の奥です。</p></div>';
      bindProtoButtons();
      var pb=document.getElementById('pb'); pinBuf='';
      document.querySelectorAll('.key').forEach(function(k){ k.onclick=function(){
        if(k.dataset.x) pinBuf=pinBuf.slice(0,-1); else if(k.dataset.ok){ if(pinBuf===PIN){ pinOK=true; renderParent(); return; } pinBuf=''; pb.textContent='ちがいます'; return; } else if(pinBuf.length<4) pinBuf+=k.textContent;
        pb.textContent='●'.repeat(pinBuf.length);
      }; });
      return;
    }
    var doneKeys=Object.keys(S.done), read=Object.keys(S.opened).length, learned={}, used={};
    doneKeys.forEach(function(k){ (S.done[k].newWords||[]).forEach(function(w){learned[w.toLowerCase()]=1}); S.done[k].reply.forEach(function(w){ w.replace(/[^A-Za-z' ]/g,'').split(' ').forEach(function(x){ if(x) used[x.toLowerCase()]=1; }); }); });
    // 3つの タブ（ようす／こども／せってい）。縦に のびて 見にくい と 言われた（2026-10-19 オーナー・まなびクエスト・からくり工房と同じ形）
    // 子が2人からは 上に なまえを ならべ、ようす と こども は えらんだ子の ぶんを 出す
    var PT=[['look','📊 ようす'],['kid','👧 こども'],['set','⚙️ せってい']];
    function pane(k){ return '<div class="ppane" data-p="'+k+'"'+(ptab===k?'':' hidden')+'>'; }
    app.innerHTML = '<h1>👪 おうちの ひと</h1>'+
      (kidIds().length>1?'<div id="pkids">'+kidIds().map(function(id){ return '<button class="kid'+(id===K.cur?' on':'')+'" data-pk="'+id+'">'+esc(kidName(id))+'</button>'; }).join('')+'</div>':'')+
      '<div class="ptabs" role="tablist">'+PT.map(function(t){ return '<button role="tab" data-pt="'+t[0]+'" aria-selected="'+(ptab===t[0])+'">'+t[1]+'</button>'; }).join('')+'</div>'+
      pane('look')+
      '<div class="card"><h2>こんしゅうの モコから</h2><div class="stat"><div><b>'+read+'</b><small>読んだ手紙</small></div><div><b>'+Object.keys(learned).length+'</b><small>読めた新しい語</small></div><div><b>'+Object.keys(used).length+'</b><small>自分で使った語</small></div></div>'+
      (doneKeys.length? '<p class="note">えの なかで みつけた ことば：'+Object.keys(S.found||{}).reduce(function(a,k){return a+S.found[k].length},0)+'こ ／ モコに きいた かず：'+Object.keys(S.asked||{}).reduce(function(a,k){return a+S.asked[k].length},0)+'回 ／ ことばクイズ：'+(S.quiz||0)+'回</p>'+
      '<p class="note">はじめて使った言いかた：「'+esc(S.done[doneKeys[doneKeys.length-1]].reply.join(' '))+'」。「にほんご」を見た回数：'+S.jaTaps+'</p>' : '<p class="note">まだ返事がありません。</p>')+'</div>'+
      (function(){ var st=levelStats(); var ck=function(b){return b?'✅':'⬜'}; return '<div class="card"><h2>レベル</h2><p class="note">いま：<b>'+L.levels[S.level].label+'</b>（'+L.levels[S.level].who+'）。モコが「すこし ながい てがみ、かいてもいい？」と聞いて、子が「いいよ」と言うと上がります。下がりません。</p>'+
        '<p class="note">つぎに上がる めやす（直近7通）：<br>'+ck(st.okOpen)+' 開いた手紙 '+st.opened+' / 7（5以上）<br>'+ck(st.okTaps)+' 1通あたり '+(S.level>=2?'「にほんご」':'「きく」')+'を押した回数 '+st.tapsAvg.toFixed(1)+'（1以下）<br>'+ck(st.okQuiz)+' ことばクイズ 直近3回の正答率 '+(st.quiz===null?'—':Math.round(st.quiz*100)+'%')+'（80%以上・'+st.quizN+'/3回）</p>'+
        '<label class="inline"><input type="checkbox" id="lk"'+(S.lockLevel?' checked':'')+'> レベルを固定する（モコは聞かない）</label>'+
        (function(){ var ks=Object.keys(S.done).filter(function(k){return S.done[k].same!==null&&S.done[k].same!==undefined}); if(!ks.length) return ''; var ok=ks.filter(function(k){return S.done[k].same}).length; var oa=[]; Object.keys(S.done).forEach(function(k){ (S.done[k].order||[]).forEach(function(r){oa.push(r)}); }); var o1=oa.filter(function(r){return r.ok}).length; return '<p class="note">✏️ 書く力（レベル2〜3・AI の手紙）：そのまま通った文 '+ok+' / '+ks.length+'（直しが入った文は「モコなら こう かくよ」で見せています）'+(oa.length?'<br>🔀 ならべかえ（レベル3）：1回で ぴったり '+o1+' / '+oa.length+'文':'')+'</p>'; })()+
        ((S.levelLog||[]).length?'<p class="note">これまで：'+S.levelLog.map(function(e){return e.at+' → '+L.levels[e.to].label+'（'+(e.by==='moco'?'モコが聞いた':'おうちの人')+'）'}).join('、')+'</p>':'')+'</div>'; })()+
      '<div class="card"><h2>とどいた手紙</h2>'+(doneKeys.length?'<ol class="log">'+doneKeys.map(function(k){return '<li>Day '+L.trip[k].day+' '+esc(L.trip[k].en)+'：「'+esc(S.done[k].reply.join(' '))+'」→ '+esc(S.done[k].moco)+'</li>'}).join('')+'</ol>':'<p class="note">まだ ありません</p>')+'</div>'+
      '</div>'+pane('kid')+
      '<div class="card"><h2>この子の せってい</h2><label>なまえ（えいごの てがみに 出る）<input id="nm" value="'+esc(S.name)+'" maxlength="12"></label>'+
      '<label>にほんごの なまえ（にほんごの 文に 出る・空なら 上と同じ）<input id="nmja" value="'+esc(S.nameJa||'')+'" maxlength="12" placeholder="そうすけ"></label>'+
      '<div class="lab note" style="margin-top:8px">すきなこと（3つまで・手紙に出ます）</div>'+likesTiles(((S.likes||{}).picks||[]))+'<label>ほかに むちゅうな もの（おうちの人が書く・「、」で区切る）<input id="lkfree" value="'+esc((S.likes||{}).free||'')+'" maxlength="40" placeholder="ポケモン、ミニバス"></label>'+
      '<label>レベル<select id="lv">'+[0,1,2,3].map(function(k){return '<option value="'+k+'"'+(k===S.level?' selected':'')+'>'+L.levels[k].label+'：'+L.levels[k].who+'</option>'}).join('')+'</select></label>'+
      '<label class="inline"><input type="checkbox" id="aj"'+(S.autoJa?' checked':'')+'> にほんごを いつも 出す（レベル0〜1 は はじめから ON）</label>'+
      '<div class="row"><button class="btn on" id="sv">ほぞん</button></div><p class="note">レベルは ここで いつでも 変えられます（上げるのも 下げるのも）。まだ届いていない手紙から変わります。</p></div>'+
      '<div class="card"><h2>👧 こどもたち</h2><p class="note">上の なまえ（ここ か てがみの画面）で 切りかえます。きろく・レベル・すきなこと は 子ごと、サーバーの設定は 共通です。</p><ul class="log">'+kidIds().map(function(id){ var k=K.kids[id]; return '<li>'+(id===K.cur?'▶ ':'')+esc(kidName(id))+'（'+L.levels[k.level||0].label+'・てがみ '+Object.keys(k.done||{}).length+'通）'+(kidIds().length>1?' <button class="btn" data-del="'+id+'">けす</button>':'')+'</li>'; }).join('')+'</ul><div class="row"><button class="btn" id="kadd">＋ 子を ついか</button></div></div>'+
      '</div>'+pane('set')+
      '<div class="card"><h2>🤖 AI の手紙（サーバー）</h2><p class="note">Cloudflare に置いたサーバーの住所と合言葉を入れると、手紙とモコの返事を Claude が書きます。空なら決まった文のままです。置きかたは docs/SERVER.md。</p>'+
      '<label>サーバーの住所<input id="sv_url" value="'+esc(S.server||'')+'" placeholder="https://moco-post-server.xxxx.workers.dev" inputmode="url" autocapitalize="off"></label>'+
      '<label>合言葉<input id="sv_tok" type="text" class="secret" value="'+esc(S.token||'')+'" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></label>'+
      '<label class="inline"><input type="checkbox" id="ai"'+(S.useAi?' checked':'')+'> AI の手紙を使う（まだ開いていない手紙から）</label>'+
      '<div class="row"><button class="btn on" id="sv_save">ほぞん</button><button class="btn" id="sv_test">つながるか ためす</button><button class="btn" id="sv_redo">きょうの手紙を 作りなおす</button></div><p class="note" id="sv_msg">'+
      (function(){ var mt=meterText(); if(mt) mt='<br>'+mt; var g=S.aiLog||[]; if(!g.length) return (S.aiErr?'さいごのエラー：'+esc(S.aiErr):'')+mt; var tin=0,tout=0; g.forEach(function(e){ if(e.usage){tin+=e.usage.input_tokens||0; tout+=e.usage.output_tokens||0;} }); return 'AI を呼んだ回数：'+g.length+'（手紙 '+g.filter(function(e){return e.what==='letter'}).length+'・返事 '+g.filter(function(e){return e.what==='reply'}).length+'）／ トークン 入 '+tin+'・出 '+tout+(function(){ var ms=g.filter(function(e){return e.ms}).map(function(e){return e.ms}); return ms.length?'／ 手紙1通の時間 さいきん '+Math.round(ms[ms.length-1]/1000)+'秒（さいだい '+Math.round(Math.max.apply(null,ms)/1000)+'秒）':''; })()+(function(){ var n=todayIndex(); if(S.done[n]) n++; return n<L.trip.length ? '<br>あしたの手紙：'+(aiAt(n)?'✅ さきよみ ずみ':'まだ（へんじを出したあと・開いたときに 作っておきます）') : ''; })()+(S.aiErr?'<br>さいごのエラー：'+esc(S.aiErr):'')+mt; })()+'</p></div>'+
      protoButtonsHtml()+
      '<p class="note">本物では モコの返事は AI が書きます。この試作は決まった文です。レベル0〜1 の返事は「絵を選ぶ」（10/13 の直し）。手紙の文は レベルごとに 10日ぶん 用意してあります。</p>'+
      '</div></div>';
    app.querySelectorAll('[data-pt]').forEach(function(b){ b.onclick=function(){ ptab=b.dataset.pt; app.querySelectorAll('[data-pt]').forEach(function(x){ x.setAttribute('aria-selected', String(x===b)); }); app.querySelectorAll('.ppane').forEach(function(x){ x.hidden = x.dataset.p!==ptab; }); window.scrollTo(0,0); }; });
    app.querySelectorAll('[data-pk]').forEach(function(b){ b.onclick=function(){ var id=b.dataset.pk; if(!K.kids[id]||id===K.cur) return; K.cur=id; S=K.kids[id]; save(); renderParent(); }; });
    var lkSel=((S.likes||{}).picks||[]).slice(); bindLikes(app, lkSel, null);
    document.getElementById('sv').onclick=function(){ S.name=document.getElementById('nm').value.trim(); S.nameJa=document.getElementById('nmja').value.trim(); var nf=document.getElementById('lkfree').value.trim(); var before=JSON.stringify(S.likes||{}); S.likes={picks:lkSel.slice(), free:nf}; if(JSON.stringify(S.likes)!==before) forgetToday(); var nl=parseInt(document.getElementById('lv').value,10); if(nl!==S.level){ S.levelLog=(S.levelLog||[]).concat([{at:today(),to:nl,by:'parent'}]); S.askAfter=0; var ti=todayIndex(); if(!S.done[ti]){ if(S.ai) delete S.ai[ti]; delete S.opened[ti]; S.shown=1; } } S.level=nl; S.autoJa=document.getElementById('aj').checked; S.lockLevel=document.getElementById('lk').checked; save(); this.textContent='ほぞんした'; };
    document.getElementById('sv_save').onclick=function(){ var sv=document.getElementById('sv_url').value.trim(), tk=document.getElementById('sv_tok').value.trim(), ua=document.getElementById('ai').checked; K.shared={server:sv,token:tk,useAi:ua}; kidIds().forEach(function(id){ var k=K.kids[id]; k.server=sv; k.token=tk; k.useAi=ua; }); S.server=sv; S.token=tk; S.useAi=ua; save(); this.textContent='ほぞんした'; };
    document.getElementById('kadd').onclick=addKid;
    app.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='ほんとうに けす？'; return; } removeKid(b.dataset.del); renderParent(); }; });
    document.getElementById('sv_test').onclick=function(){ var m=document.getElementById('sv_msg'); var u=document.getElementById('sv_url').value.trim().replace(/\/+$/,''); if(!u){ m.textContent='住所が空です'; return; } m.textContent='ためしています…'; var tk=document.getElementById('sv_tok').value.trim(); fetch(u+'/health',{headers: tk?{'Authorization':'Bearer '+tk}:{}}).then(function(r){return r.json()}).then(function(j){ if(!j.ok){ m.textContent='へんな返事：'+JSON.stringify(j); return; } var a = j.tokenOk===true ? '合言葉も OK' : j.tokenOk===false ? '🚨 合言葉が ちがいます（入れ直して「ほぞん」）' : tk ? '合言葉の確認は サーバーを更新したあとに できます' : '合言葉が 空です'; m.textContent='つながりました（model: '+j.model+' / prompt '+j.prompt+'）。'+a; }, function(e){ m.textContent='つながりません：'+e; }); };
    document.getElementById('sv_redo').onclick=function(){ var i=todayIndex(); if(S.done[i]){ document.getElementById('sv_msg').textContent='きょうの手紙は もう返事を出しています。「つぎの手紙を いま届ける」で次へ'; return; } if(S.ai) delete S.ai[i]; delete S.opened[i]; S.shown=1; save(); tab='letter'; render(); };
    bindProtoButtons();
  }
  render(); setTimeout(prefetchNext, 3000);  // 開いたときにも あしたの手紙を さきよみ
})();
</script>
