<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"></head><body><title>ぴたっと</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yomogi&family=Klee+One:wght@600&display=swap">
<style>
/* Layout: one-screen phone app set on a classroom blackboard. Single dark look by choice: chalk on green board, wooden frame. */
:root{
  --bg:#2E5B4C; --board-d:#1F4438; --fg:#F4F1E6; --mute:#A9BDB3; --line:#F4F1E64d;
  --pink:#FFB3C1; --yellow:#FFE08A; --blue:#A9DDF5; --green:#B8E6B0; --wood:#8A5A36; --wood-d:#5E3B21;
  --font:'Yomogi','Klee One','Hiragino Maru Gothic ProN',cursive;
  --read:'Klee One','Hiragino Sans','Yu Gothic',sans-serif;
  --grain:none; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background-color:var(--bg);color:var(--fg);font-family:var(--font);font-weight:400;
  background-image:linear-gradient(104deg,transparent 0 22%,#ffffff0a 31%,transparent 43%),linear-gradient(96deg,transparent 0 58%,#ffffff08 66%,transparent 78%),
    radial-gradient(ellipse at 28% 18%,#ffffff14,transparent 55%),radial-gradient(ellipse at 78% 72%,#ffffff0d,transparent 50%),radial-gradient(ellipse at 50% 105%,#00000040,transparent 60%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  display:flex;flex-direction:column;box-sizing:border-box;-webkit-user-select:none;user-select:none;overflow:hidden;-webkit-touch-callout:none}
body::after{content:"";position:fixed;inset:0;border:9px solid var(--wood);box-shadow:inset 0 0 0 2px var(--wood-d),inset 0 0 34px #0008;pointer-events:none;z-index:50}
#app{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;min-height:0;padding:0 6px;box-sizing:border-box}
.hid{display:none!important}
.title h1,.q,.cover .cmd,.btn,.flash,.bar,.fld h2,.result .big,.chip,.back,.quit,.timer{-webkit-mask-image:var(--grain);mask-image:var(--grain);-webkit-mask-size:120px;mask-size:120px}
.top{display:flex;justify-content:space-between;align-items:center;height:32px;font-size:17px}
.topl{display:flex;align-items:center;gap:10px}
.lives{display:flex;gap:7px}
.lives i{width:19px;height:19px;border-radius:50%;display:inline-block;box-shadow:inset -2px -3px 0 #0003,1px 2px 2px #0006}
.lives i:nth-child(1){background:#E8554A}.lives i:nth-child(2){background:#F2C84B}.lives i:nth-child(3){background:#4A90D9}
.lives i.off{background:transparent;box-shadow:none;border:2px dashed var(--line);box-sizing:border-box}
.sc{font-variant-numeric:tabular-nums;color:var(--mute)}
.sc b{color:var(--fg);font-size:24px;font-weight:400}
.q{font-size:25px;line-height:1.25;text-align:center;margin:4px 0 6px;min-height:34px;word-break:keep-all;color:var(--yellow)}
.stage{flex:1;min-height:0;position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
.cover{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box}
.cover .cmd{font-size:40px;line-height:1.3;word-break:keep-all;text-wrap:balance;color:var(--yellow)}
.cover .sub{font-size:16px;color:var(--mute)}
.timer{position:absolute;left:0;top:0;height:6px;background:var(--yellow);width:100%;border-radius:0 3px 3px 0}
.flash{position:absolute;left:50%;top:8px;transform:translateX(-50%);padding:2px 16px 4px;border-radius:12px;font-size:28px;white-space:nowrap;background:var(--board-d);display:flex;align-items:center;gap:8px}
.flash svg{width:40px;height:40px;flex:none}
.flash.ok{color:var(--yellow)} .flash.ng{color:var(--blue)}
.btns{height:80px;display:grid;gap:12px;align-items:center;padding-top:10px}
.btns.two{grid-template-columns:1fr 1fr}
.btn{border:3px solid var(--pink);border-radius:14px;background:transparent;color:var(--pink);font:400 27px var(--font);padding:11px 8px;width:100%;touch-action:manipulation}
.btn:active{background:#ffffff1f}
.btn.sky{border-color:var(--blue);color:var(--blue)}
.btn:focus-visible,.chip:focus-visible,.back:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.title{flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:12px;position:relative;padding:0 8px}
.title h1{font-size:50px;margin:0;font-weight:400;color:var(--yellow);line-height:1.15;letter-spacing:.02em}
.title p{margin:0 0 10px;font-size:18px;line-height:1.6}
.day{position:absolute;right:6px;top:8px;writing-mode:vertical-rl;font-size:15px;color:var(--mute);letter-spacing:.12em}
.sub2{font-size:14px;color:var(--mute);margin-top:-6px;text-align:center}
.tray{height:14px;background:#A9744A;border-top:2px solid var(--wood-d);margin:0 -14px;position:relative}
.tray i{position:absolute;bottom:14px;height:9px;border-radius:3px}
.link{background:none;border:0;color:var(--mute);font:400 16px var(--font);text-decoration:underline;padding:8px;align-self:center}
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.result p{margin:0;color:var(--mute);font-size:17px}
.result .big{font-size:76px;color:var(--yellow);line-height:1}
.result table{border-collapse:collapse;font-size:15px}
.result td{padding:1px 8px;text-align:left}
.result td.n{text-align:right;font-variant-numeric:tabular-nums}
.ok-t{color:var(--green)} .ng-t{color:var(--pink)}
.rowb{display:flex;gap:12px;width:100%;max-width:340px}
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;height:46px;font-size:24px;color:var(--yellow)}
.back{width:40px;height:40px;border-radius:50%;border:2px solid var(--fg);background:transparent;color:var(--fg);font:400 20px var(--font)}
.quit{width:30px;height:30px;border-radius:50%;border:2px solid var(--mute);background:transparent;color:var(--mute);font:400 15px var(--font);padding:0}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.fld{margin-top:14px}
.fld h2{font-size:19px;margin:0 0 6px;font-weight:400;color:var(--blue)}
.fld .d{font:600 13px/1.6 var(--read);color:var(--mute);margin:-2px 0 8px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{border:2px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:8px 4px;font:400 16px var(--font);min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;word-break:keep-all}
.chip small{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.chip .st{color:var(--yellow);font-size:13px;letter-spacing:1px;min-height:14px}
.chip.free{border-color:var(--green)}
.note{font:600 13px/1.75 var(--read);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:12px;margin-top:14px}
.note b{color:var(--yellow);font-weight:600}
.rec{width:100%;border-collapse:collapse;font:600 13px var(--read)}
.rec td{padding:4px 4px;border-bottom:1px dashed var(--line)}

.btn small{display:block;font-size:12px;color:var(--mute);margin-top:2px;word-break:keep-all}
.nw{white-space:nowrap}
body{-webkit-text-stroke:.45px currentColor}
.title h1{-webkit-text-stroke:1.6px currentColor}
.btn,.cover .cmd,.result .big,.bar{-webkit-text-stroke:.9px currentColor}
.q,.flash,.pl,.chip,.title p{-webkit-text-stroke:.6px currentColor}
.btn small,.sub2,.chip small,.note,.fld .d,.rec{-webkit-text-stroke:0}
.btn small{font-size:13px;color:var(--fg);opacity:.8}
.half{flex:1;min-height:0;display:flex;flex-direction:column}.rot{transform:rotate(180deg)}
.half .q{font-size:19px;min-height:24px;margin:2px 0 3px}.half .btns{height:54px;padding-top:6px}.half .btn{font-size:21px;padding:6px}
.half .cover .cmd{font-size:27px}.half .flash{font-size:22px;top:4px}.half .flash svg{width:30px;height:30px}
.mid{height:34px;display:flex;align-items:center;justify-content:space-between;font-size:15px}
.btn.grn{border-color:var(--green);color:var(--green)} .btn.yel{border-color:var(--yellow);color:var(--yellow)}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .two2 .btn{font-size:20px;padding:10px 4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .seg .chip{min-height:50px;font-size:17px} .chip.on{border-color:var(--yellow);color:var(--yellow);background:#ffffff14}
.pl{font-size:22px;margin:20px 0 8px;display:flex;align-items:center;gap:10px}
.mg{width:19px;height:19px;border-radius:50%;display:inline-block;box-shadow:inset -2px -3px 0 #0003,1px 2px 2px #0006;flex:none}
.mg.a{background:#E8554A}.mg.b{background:#4A90D9}
.vsc{display:inline-flex;align-items:center;gap:6px;color:var(--fg);font-size:22px}
.result .big.txt{font-size:46px;line-height:1.2}
.rec td.n{text-align:right;font-variant-numeric:tabular-nums}
</style>

<div id="app">
  <div id="scrTitle" class="page">
    <div class="title">
      <div class="day" id="day"></div>
      <h1>3びょう<br>さんすう</h1>
      <p>かずの かんかく ミニゲーム</p>
      <button class="btn" id="btnStart">あそぶ<small>ぜんぶ まぜて・3かい まちがえたら おしまい</small></button>
      <div class="two2"><button class="btn sky" id="btnPrac">れんしゅう<small><span class="nw">すきな</span> <span class="nw">ゲームを</span> <span class="nw">5かい</span></small></button><button class="btn grn" id="btnWeak"><span class="nw">にがて</span> <span class="nw">とっくん</span><small><span class="nw">まちがえた</span> <span class="nw">ゲームを</span> <span class="nw">9かい</span></small></button></div>
      <button class="btn yel" id="btnVs">ふたりで たいせん<small>むかいあって どうじに スタート</small></button>
      <p id="homeBest" style="font-size:17px;color:var(--yellow);margin:8px 0 0"></p>
      <button class="link" id="btnParent">おうちのかたへ</button>
    </div>
    <div class="tray"><i style="left:14%;width:46px;background:#F4F1E6"></i><i style="left:34%;width:30px;background:#FFB3C1"></i><i style="left:47%;width:38px;background:#FFE08A"></i><i style="right:10%;width:64px;height:18px;background:#3B4A7A;border-top:5px solid #C9B28A"></i></div>
  </div>

  <div id="scrPrac" class="page hid">
    <div class="bar"><button class="back" data-home aria-label="もどる">←</button>れんしゅう</div>
    <div class="scroll" id="pracList"></div>
  </div>

  <div id="scrVs" class="page hid">
    <div class="bar"><button class="back" data-home aria-label="もどる">←</button>ふたりで たいせん</div>
    <div class="scroll">
      <div class="note">むかいあって すわって、おなじ もんだいを どうじに スタート。<br>さきに せいかいした ほうが 1てん。まちがえると おてつき。<br>さきに 5てんで かち。つよい ひとは ハンデを つけよう。</div>
      <div class="pl"><i class="mg a"></i>あか</div><div class="seg" id="segA"></div>
      <div class="pl"><i class="mg b"></i>あお</div><div class="seg" id="segB"></div>
      <div style="margin-top:26px"><button class="btn yel" id="btnVsGo">はじめる</button></div>
    </div>
  </div>

  <div id="scrParent" class="page hid">
    <div class="bar"><button class="back" data-home aria-label="もどる">←</button>おうちのかたへ</div>
    <div class="scroll" id="parentBody"></div>
  </div>

  <div id="scrPlay" class="hid" style="flex:1;display:flex;flex-direction:column;min-height:0">
    <div class="top"><span class="topl"><button class="quit" id="btnQuit" aria-label="やめる">×</button><span class="lives" id="lives"></span><span id="round" class="sc"></span></span><span class="sc" id="scbox"></span></div>
    <div class="q" id="qtext"></div>
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="timer hid" id="timer"></div>
      <div class="flash hid" id="flash"></div>
      <div class="cover hid" id="cover"><div class="cmd" id="cmd"></div><div class="sub" id="sub"></div></div>
    </div>
    <div class="btns" id="btns"></div>
  </div>

  <div id="scrDuel" class="hid" style="flex:1;display:flex;flex-direction:column;min-height:0">
    <div class="half rot" id="hB"></div>
    <div class="mid"><button class="quit" id="btnDQuit" aria-label="やめる">×</button><span class="vsc" id="dsc"></span><span class="sc" id="dinfo"></span></div>
    <div class="half" id="hA"></div>
  </div>

  <div id="scrEnd" class="result hid">
    <p id="endLabel">クリアした かず</p>
    <div class="big" id="total">0</div>
    <p id="best"></p>
    <table id="tbl"></table>
    <div class="rowb"><button class="btn" id="btnAgain">もういちど</button><button class="btn sky" id="btnHome">ホーム</button></div>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const cv=$('cv');let ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const PAL=['#FF9AA8','#FFE08A','#B8E6B0','#A9DDF5','#D5C3F7','#FFC89A'];
const NAVY='#1F4438';
let W=0,H=0,dpr=1;const grav={x:0,y:1};
function fit(){dpr=Math.min(2,devicePixelRatio||1);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',()=>{fit();if(duelOn)dFit();});
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let INK='#1F4438',MUTE='#A9BDB3';
let FPX=16;function ft(t,x,y){ctx.save();ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=Math.max(.6,FPX*.045);ctx.lineJoin='round';ctx.strokeText(t,x,y);ctx.restore();ctx.fillText(t,x,y);}
function font(px,w){FPX=px;ctx.font=(w||900)+' '+Math.max(8,Math.round(px))+'px '+getComputedStyle(document.body).fontFamily;}
let GR=null;(function(){const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),d=x.createImageData(120,120);
  for(let i=0;i<d.data.length;i+=4){const hole=Math.random()<.13;d.data[i+3]=hole?Math.floor(50+Math.random()*150):0;}x.putImageData(d,0,0);GR=c;
  const m=document.createElement('canvas');m.width=m.height=120;const y=m.getContext('2d'),e=y.createImageData(120,120);
  for(let i=0;i<e.data.length;i+=4){e.data[i+3]=Math.random()<.16?Math.floor(Math.random()*110):255;}y.putImageData(e,0,0);
  try{document.documentElement.style.setProperty('--grain','url('+m.toDataURL()+')');}catch(err){}})();
let GP=null;function grain(){if(!GP)GP=ctx.createPattern(GR,'repeat');ctx.save();ctx.globalCompositeOperation='destination-out';ctx.fillStyle=GP;ctx.fillRect(0,0,W,H);ctx.restore();}
function clear(){ctx.clearRect(0,0,W,H);INK=css('--fg')||INK;MUTE=css('--mute')||MUTE;}
function ball(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
function pill(t,x,y,px,bg,fg){font(px);const w=ctx.measureText(t).width+px*1.2,h=px*1.7;ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,h/2);ctx.fill();if(bg===NAVY){ctx.strokeStyle=fg;ctx.lineWidth=2;ctx.stroke();}ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ft(t,x,y+1);}
function num(t,x,y,px,c){ctx.fillStyle=c||NAVY;font(px);ctx.textAlign='center';ctx.textBaseline='middle';ft(t,x,y+1);}
function scatter(n,x0,y0,w,h,r){const pts=[];let t=0;while(pts.length<n&&t<6000){t++;const x=x0+r+Math.random()*(w-2*r),y=y0+r+Math.random()*(h-2*r);
  if(pts.every(p=>(p.x-x)**2+(p.y-y)**2>(r*2.15)**2))pts.push({x,y});}return pts;}
function frame(x,y,w,h){ctx.strokeStyle='#FFE08A';ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(x,y,w,h,16);ctx.stroke();}

// ---------- ミニゲーム ----------
// きまり：1) ことば ひとつ 2) タップ 1かい 3) すうじは まいかい かわる
const GAMES={
// かずの かん：かさに だまされない
more:{name:'おおいほう',sense:'かず',cmd(){return 'おおいほうを タップ！';},
  setup(lv){const d=[rnd(5,8),rnd(3,5),rnd(2,3)][lv],a=rnd(7,14),b=a+d,sw=Math.random()<.5,trick=Math.random()<.6;
    const nL=sw?a:b,nR=sw?b:a;const rf=trick?13:8,rm=trick?8:13;
    this.rL=nL<nR?rf:rm;this.rR=nR<nL?rf:rm;
    this.L=scatter(nL,W*.03,H*.06,W*.44,H*.88,this.rL);this.R=scatter(nR,W*.53,H*.06,W*.44,H*.88,this.rR);
    if(this.L.length===this.R.length)this.L.pop();this.ans=this.L.length>this.R.length?'L':'R';},
  tap(x){finish((x<W/2?'L':'R')===this.ans);},
  draw(rev){ctx.strokeStyle=MUTE;ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(W/2,8);ctx.lineTo(W/2,H-8);ctx.stroke();ctx.setLineDash([]);
    this.L.forEach(p=>ball(p.x,p.y,this.rL,'#FF9AA8'));this.R.forEach(p=>ball(p.x,p.y,this.rR,'#A9DDF5'));
    if(rev){pill(this.L.length+'こ',W*.25,H-30,22,NAVY,'#F4F1E6');pill(this.R.length+'こ',W*.75,H-30,22,NAVY,'#F4F1E6');
      frame(this.ans==='L'?4:W/2+4,4,W/2-8,H-8);}}},
// かぞえる：おちてくる あめを かぞえて とめる
stop:{name:'ストップ',sense:'かぞえる',noTimer:true,buttons:['ストップ！'],cmd(){return this.N+'こで ストップ！';},
  setup(lv){this.N=rnd(5,9)+lv*2;this.iv=[.55,.42,.32][lv];this.tol=lv<2?1:0;this.pts=[];this.acc=this.iv*.3;this.max=this.N+4;this.R=15;this.end=false;},
  box(){return {x:W*.2,y:H*.14,w:W*.6,h:H*.8};},
  step(dt){this.acc+=dt;if(this.acc>=this.iv){this.acc=0;const b=this.box();
      if(this.pts.length<this.max)this.pts.push({x:b.x+b.w/2+(Math.random()-.5)*b.w*.5,y:b.y+this.R,vx:(Math.random()-.5)*80,vy:150,c:PAL[rnd(0,5)]});
      else finish(false);}},
  anim(dt){const b=this.box(),R=this.R,G=1500,pts=this.pts;
    for(const p of pts){p.vx+=grav.x*G*dt;p.vy+=grav.y*G*dt;p.vx*=.99;p.vy*=.99;p.x+=p.vx*dt;p.y+=p.vy*dt;}
    for(let k=0;k<5;k++){for(let a=0;a<pts.length;a++)for(let c=a+1;c<pts.length;c++){const p=pts[a],q=pts[c];const dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy;
        if(d2<4*R*R){const d=Math.sqrt(d2)||.01,nx=dx/d,ny=dy/d,o=(2*R-d)/2;p.x-=nx*o;p.y-=ny*o;q.x+=nx*o;q.y+=ny*o;
          const rv=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;if(rv<0){const im=rv*.55;p.vx+=nx*im;p.vy+=ny*im;q.vx-=nx*im;q.vy-=ny*im;}}}
      for(const p of pts){if(p.x<b.x+R){p.x=b.x+R;p.vx=Math.abs(p.vx)*.25;}if(p.x>b.x+b.w-R){p.x=b.x+b.w-R;p.vx=-Math.abs(p.vx)*.25;}
        if(p.y<b.y+R){p.y=b.y+R;p.vy=Math.abs(p.vy)*.25;}if(p.y>b.y+b.h-R){p.y=b.y+b.h-R;p.vy=-Math.abs(p.vy)*.25;}}}},
  btn(){const n=this.pts.length,d=Math.abs(n-this.N);finish(d<=this.tol,d===0?'ぴったり！':null);},
  draw(rev){const b=this.box();ctx.lineWidth=5;ctx.strokeStyle=MUTE;ctx.beginPath();ctx.moveTo(b.x-8,b.y-8);ctx.lineTo(b.x-8,b.y+b.h-12);ctx.quadraticCurveTo(b.x-8,b.y+b.h+8,b.x+12,b.y+b.h+8);

  if(mode==='prac'){$('endLabel').textContent=GAMES[gkey].name+'：5かいの うち';$('best').textContent='';}
  else{$('endLabel').textContent='クリアした かず';if(score>save.best){save.best=score;persist();}$('best').textContent='じこベスト '+save.best;}
  $('tbl').innerHTML=ORDER.filter(k=>tally[k]).map(k=>'<tr><td>'+GAMES[k].name+'</td><td class="n ok-t">○ '+tally[k][0]+'</td><td class="n ng-t">× '+tally[k][1]+'</td></tr>').join('');}
function stars(k){const r=st(k),n=r[0]+r[1];if(n<3)return '';const p=r[0]/n;return p>=.9&&r[0]>=10?'★★★':p>=.75&&r[0]>=6?'★★':p>=.5?'★':'';}
function kan(n){const k='〇一二三四五六七八九';return n<10?k[n]:n<20?'十'+(n%10?k[n%10]:''):k[Math.floor(n/10)]+'十'+(n%10?k[n%10]:'');}
function home(){state='idle';g=null;show('scrTitle');const d=new Date();$('day').textContent=kan(d.getMonth()+1)+'月'+kan(d.getDate())+'日（'+'日月火水木金土'[d.getDay()]+'）';$('homeBest').textContent=save.best?'じこベスト '+save.best:'';}
function pracPage(){show('scrPrac');$('pracList').innerHTML=FIELDS.map(f=>'<div class="fld"><h2>'+f.kid+'</h2><div class="chips">'+f.g.map(k=>{const r=st(k);
    return '<button class="chip'+(FREE.has(k)?' free':'')+'" data-k="'+k+'"><span>'+GAMES[k].name+'</span><span class="st">'+stars(k)+'</span><small>○'+r[0]+' ×'+r[1]+'</small></button>';}).join('')+'</div></div>').join('');
  $('pracList').querySelectorAll('.chip').forEach(b=>b.onclick=()=>enter(()=>start('prac',b.dataset.k)));}
function parentPage(){show('scrParent');let tot=[0,0];ORDER.forEach(k=>{const r=st(k);tot[0]+=r[0];tot[1]+=r[1];});
  $('parentBody').innerHTML='<div class="note"><b>3びょうさんすう（仮）は、数えずに「だいたい」を当てる算数あそびです。</b><br>計算の速さではなく、数・量・長さ・時間・お金の「感覚」を育てます。1回は数秒、まちがえてもすぐ答え合わせが出ます。</div>'
   +FIELDS.map(f=>'<div class="fld"><h2>'+f.name+'</h2><div class="d">'+f.desc+'</div><table class="rec">'+f.g.map(k=>{const r=st(k),n=r[0]+r[1];
     return '<tr><td>'+GAMES[k].name+(FREE.has(k)?'（無料）':'')+'</td><td class="n">○ '+r[0]+'</td><td class="n">× '+r[1]+'</td><td class="n">'+(n?Math.round(r[0]/n*100)+'%':'—')+'</td></tr>';}).join('')+'</table></div>').join('')
   +'<div class="note"><b>これまでの記録</b>：'+(tot[0]+tot[1])+'回あそんで ○ '+tot[0]+'・× '+tot[1]+'。記録はこの端末の中だけに残ります。</div>'
   +'<div class="note"><b>買い切りの線（案）</b>：「あそぶ」と各分野1本ずつの7本は無料。21本すべて・にがて とっくん・ふたりで たいせん は買い切りで開く想定です。広告はありません。この試作ではすべて遊べます。</div>'
   +'<div style="text-align:center;margin-top:14px"><button class="link" id="btnReset">きろくを けす</button></div>';
  let armed=false;$('btnReset').onclick=e=>{if(!armed){armed=true;e.target.textContent='ほんとうに けす（もういちど おす）';return;}save={best:0,stats:{}};persist();parentPage();};}

// ---------- ふたりで たいせん（むかいあわせ・どうじ） ----------
const DPOOL=['more','buy','longer','clock','bugs','half','find','dice','big','ten','cup','seq','sub','mlen','coin','chg'];
let duelOn=false,cur=null;const P=[],D={sc:[0,0],bag:[],n:0,st:'',t:0,tl:0,tm:1,key:'',lv:0};
function dBuild(){if(P.length)return;['hA','hB'].forEach((id,i)=>{const el=$(id);
  el.innerHTML='<div class="q"></div><div class="stage"><canvas></canvas><div class="timer"></div><div class="flash hid"></div><div class="cover"><div class="cmd"></div><div class="sub"></div></div></div><div class="btns"></div>';
  const q=s=>el.querySelector(s),c=q('canvas'),pl={i,el,cv:c,ctx:c.getContext('2d'),W:0,H:0,g:null,out:false,wait:0,q:q('.q'),flash:q('.flash'),cover:q('.cover'),cmd:q('.cmd'),sub:q('.sub'),btns:q('.btns'),timer:q('.timer')};
  c.addEventListener('pointerdown',e=>{if(!dCan(pl)||!pl.g.tap)return;const r=c.getBoundingClientRect();let x=e.clientX-r.left,y=e.clientY-r.top;if(i===1){x=r.width-x;y=r.height-y;}use(pl);pl.g.tap(x,y);});
  P.push(pl);});}
const dCan=pl=>duelOn&&D.st==='play'&&!pl.out&&pl.wait<=0;
function use(pl){cur=pl;ctx=pl.ctx;W=pl.W;H=pl.H;}
function dFit(){dpr=Math.min(2,devicePixelRatio||1);P.forEach(pl=>{const r=pl.cv.getBoundingClientRect();pl.W=r.width;pl.H=r.height;pl.cv.width=r.width*dpr;pl.cv.height=r.height*dpr;pl.ctx.setTransform(dpr,0,0,dpr,0,0);});}
function dScore(){$('dsc').innerHTML='<i class="mg b"></i>'+D.sc[1]+'　ー　'+D.sc[0]+'<i class="mg a"></i>';$('dinfo').textContent='5てんで かち';}
function dStart(){mode='vs';dBuild();duelOn=true;state='idle';g=null;D.sc=[0,0];D.bag=[];D.n=0;show('scrDuel');dFit();dScore();dNext();}
function dNext(){if(Math.max(D.sc[0],D.sc[1])>=5||D.n>=20)return dOver();
  if(!D.bag.length)D.bag=DPOOL.slice().sort(()=>Math.random()-.5);D.key=(window.__dbag&&window.__dbag.shift())||D.bag.shift();D.lv=Math.min(2,Math.floor(D.n/3));D.n++;
  const nb=!(GAMES[D.key].buttons||[]).length;P.forEach(pl=>pl.btns.classList.toggle('hid',nb));dFit();
  use(P[0]);const a=Object.create(GAMES[D.key]);a.setup(D.lv);const b=Object.create(GAMES[D.key]);Object.keys(a).forEach(k=>{b[k]=structuredClone(a[k]);});P[0].g=a;P[1].g=b;
  const c=a.cmd();P.forEach(pl=>{pl.out=false;pl.wait=vs.lv[pl.i];pl.q.textContent=c;pl.cmd.textContent=c;pl.sub.textContent=pl.wait?'ハンデ：'+pl.wait+'びょう まつ':'';
    pl.cover.classList.remove('hid');pl.flash.classList.add('hid');pl.timer.style.width='100%';pl.timer.classList.toggle('hid',!!a.noTimer);pl.btns.innerHTML='';pl.btns.className='btns'+((a.buttons||[]).length===2?' two':'')+(nb?' hid':'');
    (a.buttons||[]).forEach((t,j)=>{const e=document.createElement('button');e.className='btn'+((a.buttons.length===2&&j===1)?' sky':'');e.textContent=t;
      e.addEventListener('pointerdown',ev=>{ev.preventDefault();if(!dCan(pl))return;use(pl);pl.g.btn(j);});pl.btns.appendChild(e);});});
  D.st='cmd';D.t=1.8;beep(660,.08);}
function dFlash(pl,html,ok){pl.flash.innerHTML=html;pl.flash.className='flash '+(ok?'ok':'ng');}
function dFinish(win){const pl=cur;if(D.st!=='play'||pl.out)return;if(win){D.sc[pl.i]++;return dEnd(pl.i);}pl.out=true;dFlash(pl,'<span>× おてつき</span>');beep(160,.3,'sawtooth');}
function dEnd(w){D.st='res';D.t=2.4;dScore();if(w>=0){beep(880,.09);beep(1320,.14,'square',.09);}
  P.forEach(pl=>{pl.timer.classList.add('hid');pl.cover.classList.add('hid');if(w===pl.i)dFlash(pl,HANA+'<span>とった！</span>',true);else if(!pl.out)dFlash(pl,'<span>'+(w<0?'× じかんぎれ':'とられた…')+'</span>');});}
function dTick(dt){
  if(D.st==='cmd'){D.t-=dt;if(D.t<=0){D.st='play';D.tm=D.tl=[7,6,5][D.lv];P.forEach(pl=>{if(pl.wait>0){pl.cmd.textContent='まって…';}else pl.cover.classList.add('hid');});}}
  else if(D.st==='play'){P.forEach(pl=>{if(pl.wait>0){pl.wait-=dt;if(pl.wait<=0)pl.cover.classList.add('hid');}});
    for(const pl of P){if(D.st!=='play')break;if(pl.out)continue;use(pl);if(pl.g.step)pl.g.step(dt);}
    if(D.st==='play'){if(!P[0].g.noTimer){D.tl-=dt;P.forEach(pl=>pl.timer.style.width=Math.max(0,D.tl/D.tm*100)+'%');}if(D.tl<=0||(P[0].out&&P[1].out))dEnd(-1);}}
  else if(D.st==='res'){D.t-=dt;if(D.t<=0)return dNext();}
  P.forEach(pl=>{use(pl);if(pl.g.anim&&!pl.out)pl.g.anim(dt);clear();pl.g.draw(D.st==='res');grain();});}
function dOver(){duelOn=false;state='idle';show('scrEnd');const a=D.sc[0],b=D.sc[1];$('endLabel').innerHTML='<span class="vsc"><i class="mg a"></i>あか '+a+'　ー　'+b+' あお<i class="mg b"></i></span>';
  $('total').className='big txt';$('total').textContent=a===b?'ひきわけ！':PN[a>b?0:1]+'の かち！';$('best').textContent='たいせんは きろくに のこりません';$('tbl').innerHTML='';ctx=cv.getContext('2d');}
let last=0;function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;
  if(duelOn)dTick(dt);else if(g&&state!=='idle'){
    if(state==='cmd'){cmdT-=dt;if(cmdT<=0)play();}
    else if(state==='play'){if(g.step)g.step(dt);if(state==='play'&&!g.noTimer){tLeft-=dt;$('timer').style.width=Math.max(0,tLeft/tMax*100)+'%';if(tLeft<=0)finish(false);}}
    else if(state==='res'){resT-=dt;if(resT<=0){next();}}
    if(g.anim)g.anim(dt);
    clear();g.draw(state==='res');grain();}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
cv.addEventListener('pointerdown',e=>{if(state!=='play'||!g.tap)return;const r=cv.getBoundingClientRect();g.tap(e.clientX-r.left,e.clientY-r.top);});
function askTilt(){try{const D=window.DeviceOrientationEvent;if(!D)return;
  const on=()=>addEventListener('deviceorientation',e=>{if(e.gamma==null||e.beta==null)return;
    grav.x=Math.max(-1,Math.min(1,Math.sin(e.gamma*Math.PI/180)));grav.y=Math.max(.35,Math.min(1,Math.sin(e.beta*Math.PI/180)));});
  if(typeof D.requestPermission==='function')return D.requestPermission().then(r=>{if(r==='granted')on();}).catch(()=>{});on();}catch(e){}}
let asked=false,ready=false;
function enter(fn){if(ready)return fn();if(asked)return;asked=true;try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  const go=()=>{asked=false;ready=true;fn();};const pr=askTilt();if(pr&&pr.then)pr.then(go,go);else go();}
$('btnStart').onclick=()=>enter(()=>start('mix'));
$('btnPrac').onclick=pracPage;$('btnWeak').onclick=()=>enter(()=>start('weak'));
function vsPage(){show('scrVs');['segA','segB'].forEach((id,p)=>{$(id).innerHTML=['ハンデ なし','1びょう まつ','2びょう まつ'].map((t,i)=>'<button class="chip'+(vs.lv[p]===i?' on':'')+'" data-i="'+i+'">'+t+'</button>').join('');
  $(id).querySelectorAll('.chip').forEach(b=>b.onclick=()=>{vs.lv[p]=+b.dataset.i;vsPage();});});}
$('btnVs').onclick=vsPage;$('btnVsGo').onclick=()=>enter(dStart);
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=home);
$('btnAgain').onclick=()=>mode==='vs'?dStart():start();$('btnHome').onclick=()=>mode==='prac'?pracPage():home();
$('btnDQuit').onclick=()=>{duelOn=false;ctx=cv.getContext('2d');home();};
$('btnQuit').onclick=()=>{state='idle';setButtons([]);mode==='prac'?pracPage():home();};
home();
window.__pitatto={get state(){return state;},get key(){return gkey;},get mode(){return mode;},get vs(){return vs;},get duel(){return {st:D.st,key:D.key,sc:D.sc,on:duelOn};}};
})();
</script>
