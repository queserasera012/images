<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#ccc}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'Zen Maru Gothic';color:#1F2A44;background:#4FB8E8}
.top{height:340px;padding:56px 64px 0;display:flex;flex-direction:column;justify-content:center}
.bub{background:#FFD23F;border:6px solid #1F2A44;border-radius:36px;box-shadow:10px 10px 0 #1F2A44;padding:30px 40px;font-weight:900;font-size:62px;line-height:1.3;text-align:center}
.pic{position:absolute;left:48px;right:48px;top:390px;bottom:150px;border:6px solid #1F2A44;border-radius:36px;overflow:hidden;box-shadow:10px 10px 0 #1F2A44;background:#fff}
.pic img{width:100%;height:100%;object-fit:cover}
.cap{position:absolute;left:64px;right:64px;bottom:40px;height:90px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:40px;color:#fff;text-shadow:0 3px 0 #1F2A44}
.no{position:absolute;right:28px;top:22px;font-weight:700;font-size:30px;color:#fff;opacity:.9}
.navy{background:#1F2A44;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 90px}
.navy p{font-weight:700;font-size:56px;line-height:1.6}
.navy .y{color:#FFD23F;font-weight:900}
.navy img{width:220px;margin-top:60px;align-self:flex-end;border-radius:50%}
.blocks{position:absolute;left:90px;top:120px;display:flex;gap:16px}.blocks i{width:44px;height:44px;border-radius:10px;display:block}
.small{font-size:44px!important}
</style></head><body>
<div class="s" id="s1"><div class="no">1/5</div><div class="top"><div class="bub">子どもに「答え」を出さない<br>ゲームを作りました</div></div>
<div class="pic"><img src="c_island.jpg"></div><div class="cap">子ども3人のパパが、夜と週末に →</div></div>

<div class="s" id="s2"><div class="no">2/5</div><div class="top"><div class="bub">カフェに 行列……<br>なんで？</div></div>
<div class="pic"><img src="c_queue.jpg"></div><div class="cap">「席を増やしましょう」とは出ません</div></div>

<div class="s" id="s3"><div class="no">3/5</div><div class="top"><div class="bub">手がかりは<br>島の日記だけ</div></div>
<div class="pic"><img src="c_diary.jpg" style="object-position:top"></div><div class="cap">起きたことと、その損だけが書いてあります</div></div>

<div class="s navy" id="s4"><div class="no">4/5</div><div class="blocks"><i style="background:#FF6B6B"></i><i style="background:#FFD23F"></i><i style="background:#3DDC97"></i></div>
<p>答えを教えるより、<br><span class="y">考える力</span>を伸ばしたい。</p>
<p class="small" style="margin-top:40px">うちの子育ての方針を、<br>そのままゲームにしました。</p>
<img src="sera.png"></div>

<div class="s" id="s5"><div class="no">5/5</div><div class="top"><div class="bub" style="font-size:56px">Tiny Island Life<br>小さな島の暮らし</div></div>
<div class="pic"><img src="c_end.jpg"></div><div class="cap">App Store で無料・プロフィールのリンクから</div></div>
</body></html>
