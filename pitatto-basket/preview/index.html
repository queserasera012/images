:root{

  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:700;font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;align-items:flex-start}
.stage{position:relative;width:100%;max-width:460px;margin-block:8px;border-radius:18px;overflow:hidden;
  aspect-ratio:390/600;max-height:calc(100% - 16px);background:#1A2431;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px;pointer-events:none;gap:8px}

.score .a small{color:#8FB1FF}.score .b small{color:#FF9A91}
.score .sep{color:var(--sub);font-size:16px}
.meta{background:var(--panel);border-radius:12px;padding:6px 10px;font-size:12px;text-align:right;line-height:1.35}

<script>
// ===== ルール（DOM に触らない。node でも回せる） =====
const W = 15, H = 14, B = { x: 7.5, y: 1.2 };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
const unit = (a, b) => { const d = dist(a, b) || 1; return { x: (b.x - a.x) / d, y: (b.y - a.y) / d }; };
// 線分 a→b に いちばん近い相手（a のうしろにいる相手は 数えない。skipNear: a から この距離の相手も数えない）
function laneBlock(a, b, defs, skipNear = 0) {
  const L = dist(a, b), u = unit(a, b); let best = { d: 99, i: -1 };
  defs.forEach((p, i) => {
    if (skipNear && dist(p, a) < skipNear) return;
    const t = (p.x - a.x) * u.x + (p.y - a.y) * u.y;
    if (t < 0.05) return;
    const q = t > L ? b : { x: a.x + u.x * t, y: a.y + u.y * t };
    const d = dist(p, q); if (d < best.d) best = { d, i };
  });
  return best;
}
function nearest(p, list, skip = -1) {
  let best = { d: 99, i: -1 };
  list.forEach((q, i) => { if (i === skip) return; const d = dist(p, q); if (d < best.d) best = { d, i }; });
  return best;
}
function shotQ(p, defs) {
  const d = dist(p, B);
  const base = d < 1.6 ? .75 : d < 3 ? .55 : d < 4.5 ? .4 : d < 6 ? .28 : d < 7.5 ? .18 : .1;
  const c = nearest(p, defs).d;
  const f = c < 1 ? .2 : c < 2 ? .6 : c < 3 ? .85 : 1;
  return base * f;
}
function driveQ(p, defs) {
  const lb = laneBlock(p, B, defs);
  if (lb.d < 1.0) return { v: 0, by: lb.i };
  let v = lb.d < 1.6 ? .35 : .65;
  if (dist(p, B) > 8) v *= .8;
  return { v, by: lb.d < 1.6 ? lb.i : -1 };
}
function spotValue(p, defs) {
  const s = shotQ(p, defs), dr = driveQ(p, defs);
  return dr.v > s ? { v: dr.v, how: "drive" } : { v: s, how: "shot" };
}
// パス：パスを出す人の すぐそば(1.3m)の相手は まわりこめるので 数えない。
// もらう人に ついている相手（1.2m 以内）は、パスの線の 真上（0.4m）に いる時だけ とる
function passEval(from, to, defs, chaser = -1) {
  const len = dist(from, to), u = unit(from, to); let lane = { d: 99, i: -1 }, steal = -1;
  defs.forEach((p, i) => {
    if (i === chaser || dist(p, from) < 2.2) return;
    const t = (p.x - from.x) * u.x + (p.y - from.y) * u.y; if (t < .05) return;
    const q = t > len ? to : { x: from.x + u.x * t, y: from.y + u.y * t }, d = dist(p, q);
    const nearR = dist(p, to) < 1.2;
    if (d < (nearR ? .55 : .7)) { if (steal < 0) steal = i; return; }
    if (!nearR && d < lane.d) lane = { d, i };
  });
  if (steal >= 0) return { v: -.4, steal, lane };
  const open = nearest(to, defs).d;
  const sv = spotValue(to, defs);
