<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#5ec6e8" />
  <title>Tiny Island Life</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div id="hud-left"><span id="weather">☀️</span> <span id="day">Day 1</span> <span id="clock">6:30</span></div>
      <div id="hud-right">💰 <span id="coin">0</span></div>
    </header>

    <canvas id="island"></canvas>

    <div id="hint" hidden>ちいさな島です。しばらく眺めてみてください</div>
    <div id="toast" hidden></div>

    <!-- 建物・住民をタップしたときのカード（情報だけ。解決策は書かない） -->
    <div id="card" hidden></div>

    <nav id="bar">
      <button id="btn-build" type="button">🏗<span>つくる</span></button>
      <button id="btn-diary" type="button">📖<span>日記</span><i id="diary-dot" hidden></i></button>
    </nav>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-body"></div>
    </div>

    <div id="debug" hidden></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
