<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#3aa6b9" />
  <!-- ホーム画面から開いたときも、上の時計と電池が見えるように（D310）。白い文字で出し、下に薄い影を敷く -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tiny Island" />
  <title>Tiny Island Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="pill" id="hud-time"><span id="weather"></span><b id="day">Day 1</b><span id="clock">6:30</span></div>
      <div class="hud-right">
        <button class="pill" id="hud-pop" type="button" aria-label="住民の一覧"><span id="pop-icon"></span><b id="pop">0人</b></button>
        <div class="pill" id="hud-coin"><span id="coin-icon"></span><b id="coin">0</b></div>
      </div>
    </header>

    <!-- はじめの数分の「やること」（D290） -->
    <div id="quest" hidden></div>

    <canvas id="island" aria-label="島のようす"></canvas>

    <div id="hint" class="note" hidden>ちいさな島です。しばらく眺めてみてください<br />指で島を動かせます</div>
    <div id="toast" class="note" hidden role="status"></div>

    <!-- 建物・住民をタップしたときのカード（起きていることだけ。解決策は書かない） -->
    <div id="card" hidden></div>

    <nav id="bar">
      <button id="btn-build" class="pill-btn" type="button"><span class="i"></span>つくる</button>
      <button id="btn-diary" class="pill-btn" type="button"><span class="i"></span>日記<i id="diary-dot" hidden></i></button>
    </nav>

    <!-- 建てる場所を選んでいるあいだの帯 -->
    <div id="placebar" hidden>
      <div id="place-title"></div>
      <div class="place-buttons">
        <button id="place-cancel" type="button">やめる</button>
        <button id="place-ok" type="button" disabled>ここに建てる</button>
      </div>
    </div>

    <div id="sheet" hidden>
      <div class="sheet-body"></div>
    </div>

    <div id="debug" hidden></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
