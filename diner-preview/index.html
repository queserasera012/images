<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5ccdf2">
<title>まちかど食堂（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="style.css?v=1115">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="chip tb" id="dayChip" aria-label="記録を みる">1日目</button>
    <div class="clock"><div class="clock-bar"><i id="clockFill"></i></div><span id="clockText">11:00</span></div>
    <button class="pill money tb" id="money" aria-label="お金の使い道">¥0</button>
    <button class="pill rep tb" id="rep" aria-label="お店の評判"><small>評判</small><span id="repStars">★</span></button>
    <button class="wallet" id="walletBtn" aria-label="ショップ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z" fill="#fff" stroke="#2a2350" stroke-width="2" stroke-linejoin="round"/><path d="M9 10V7a3 3 0 0 1 6 0v3" fill="none" stroke="#2a2350" stroke-width="2" stroke-linecap="round"/><path d="M9.5 14.5l1.8 1.8 3.4-3.6" fill="none" stroke="#ff4f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ショップ</span></button>
  </header>

  <!-- 営業 -->
  <section id="service" class="view" hidden>
    <div class="scene">
      <div class="sign"><span id="shopName">屋台</span></div>
      <div class="door">
        <div class="door-label">入口</div>
        <div class="queue" id="queue"></div>
      </div>
      <div class="menuboard" id="menuboard"></div>
      <div class="seats" id="seats"></div>
    </div>
    <div class="rail-title">注文の札 <small>タップで作りはじめる</small></div>
    <div class="rail" id="tickets"></div>
    <div class="kitchen" id="kitchen"></div>
    <div class="pass-wrap">
      <div class="pass-label">受け<br>渡し台</div>
      <div class="pass" id="pass"></div>
      <div class="chef pass-chef" id="passChef"></div>
    </div>
    <div class="todaybar" id="todaybar"></div>
    <button class="pause" id="pauseBtn" aria-label="一時停止">Ⅱ</button>
    <button class="pause fast" id="fastBtn" aria-label="早送り" hidden>▶▶</button>
    <div class="fx" id="fx"></div>
  </section>

  <!-- 日報 -->
  <section id="report" class="view" hidden></section>

  <!-- 夜の準備 -->
  <section id="night" class="view" hidden>
    <div class="hero" id="hero"></div>
    <div id="rivalBar"></div>
    <div class="quick" id="prepList"></div>
    <div id="sayBox"></div>
    <div class="open-bar top">
      <button class="big go" id="openBtn">開店する！</button>
    </div>
    <div class="boosts top" id="boostsTop"></div>
    <div class="homerow" id="homeRow"></div>
  </section>
  <div class="psheet" id="psheet" hidden>
    <div class="pcard">
      <div class="phead"><nav class="tabs" id="tabs"></nav><button class="pclose" id="psClose" aria-label="とじる">×</button></div>
      <div class="panel" id="panel"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="coach" id="coach" hidden></div>
<script type="module" src="js/main.js?v=1115"></script>
</body>
</html>
